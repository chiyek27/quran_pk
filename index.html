<html>
<!-- https://surahquran.com/ -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<link href="/css/arab.css" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600&amp;family=Scheherazade+New:wght@400&amp;display=swap" rel="stylesheet"/>

<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:var(--font-sans,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif);font-size:16px}
:root{
  --c-gold:#B8860B;--c-gold-light:#FFF8E1;--c-gold-border:#E8C84A;
  --c-green:#0F6E56;--c-green-light:#E1F5EE;
  --c-text:var(--color-text-primary,#1a1a1a);
  --c-muted:var(--color-text-secondary,#666);
  --c-bg:var(--color-background-primary,#fff);
  --c-surface:var(--color-background-secondary,#f8f8f8);
  --c-border:var(--color-border-tertiary,#e0e0e0);
  --radius:12px;--radius-sm:8px;
}

/* ── Layout ── */
.app{min-height:100dvh;padding:0 0 90px;max-width:480px;margin:0 auto}

/* ── Header ── */
.header{
  padding:16px 16px 12px;
  display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid var(--c-border);
}
.header-title{font-size:16px;font-weight:600;color:var(--c-text)}
.header-sub{font-size:12px;color:var(--c-muted);margin-top:2px}
.header-icon{
  width:36px;height:36px;border-radius:50%;
  background:var(--c-green-light);
  display:flex;align-items:center;justify-content:center;
  color:var(--c-green);font-size:18px;flex-shrink:0;
}

/* ── Tabs ── */
.tabs{
  display:grid;grid-template-columns:repeat(3,1fr);
  border-bottom:1px solid var(--c-border);
  background:var(--c-bg);
  position:sticky;top:0;z-index:10;
}
.tab{
  padding:12px 0;font-size:13px;font-weight:500;
  color:var(--c-muted);cursor:pointer;text-align:center;
  border-bottom:2px solid transparent;
  transition:color .18s,border-color .18s;
  display:flex;align-items:center;justify-content:center;gap:4px;
}
.tab.active{color:var(--c-green);border-bottom-color:var(--c-green)}
.tab-chevron{
  font-size:10px;line-height:1;
  display:none;transition:transform .2s;
}
.tab.active .tab-chevron{display:inline-block}
.tab-chevron.open{transform:rotate(180deg)}

/* ── Content ── */
.content{padding:14px 14px 0}

/* ── Settings card ── */
.settings-card{
  background:var(--c-surface);
  border:1px solid var(--c-border);
  border-radius:var(--radius);
  overflow:hidden;
  margin-bottom:14px;
}
.tab-settings-btn{
  padding:12px 14px;font-size:16px;
  color:var(--c-muted);cursor:pointer;
  border-bottom:2px solid transparent;
  transition:color .18s;
  display:flex;align-items:center;
}
.tab-settings-btn.active{color:var(--c-green)}
  display:flex;align-items:center;justify-content:space-between;
  padding:11px 14px;
  background:var(--c-green);
  color:#fff;cursor:pointer;
  border-radius:var(--radius);
  margin-bottom:10px;
  user-select:none;
  -webkit-tap-highlight-color:transparent;
}
.settings-summary-info{display:flex;flex-direction:column;gap:2px}
.settings-summary-title{font-size:14px;font-weight:600;line-height:1.3}
.settings-summary-sub{font-size:12px;opacity:.82}
.settings-summary-icon{font-size:18px;transition:transform .2s}
.settings-summary-icon.open{transform:rotate(180deg)}
.settings-body{display:none}
.settings-body.open{display:block}
.settings-row{
  display:flex;align-items:center;justify-content:space-between;
  padding:13px 14px;
  border-bottom:1px solid var(--c-border);
  gap:12px;
}
.settings-row:last-child{border-bottom:none}
.settings-row label{font-size:14px;color:var(--c-text);flex-shrink:0}
.settings-row select,
.settings-row input[type=number]{
  font-size:14px;padding:7px 10px;
  border-radius:var(--radius-sm);
  border:1px solid var(--c-border);
  background:var(--c-bg);color:var(--c-text);
  min-width:0;flex:1;max-width:180px;
}
.ayat-range{display:flex;gap:8px;align-items:center;flex:1;justify-content:flex-end}
.ayat-range select{width:70px;text-align:center;flex:none;padding:7px 4px;font-size:14px;border-radius:var(--radius-sm);border:1px solid var(--c-border);background:var(--c-bg);color:var(--c-text)}
.ayat-sep{font-size:12px;color:var(--c-muted);white-space:nowrap}
.toggle-group{display:flex;gap:4px}
.tgl{
  font-size:13px;padding:7px 14px;
  border-radius:20px;border:1px solid var(--c-border);
  cursor:pointer;color:var(--c-muted);background:var(--c-bg);
  font-weight:500;transition:all .15s;
}
.tgl.on{background:var(--c-green);color:#fff;border-color:var(--c-green)}
.apply-btn{
  display:block;width:calc(100% - 28px);margin:0 14px 14px;
  padding:13px;background:var(--c-green);color:#fff;
  border:none;border-radius:var(--radius-sm);
  font-size:15px;font-weight:600;cursor:pointer;
  letter-spacing:.01em;
}
.apply-btn:active{opacity:.82;transform:scale(.98)}

/* ── Surah header ── */
.surah-header{
  text-align:center;padding:20px 16px;
  background:linear-gradient(145deg,#0F6E56,#1a9970);
  border-radius:var(--radius);margin-bottom:14px;color:#fff;
}
.surah-name-ar{font-size:30px;font-family:"Conv_original-hafs";margin-bottom:6px;line-height:1.4}
.surah-name-id{font-size:13px;opacity:.85;letter-spacing:.02em}
.bismillah{
  text-align:center;font-size:24px;font-family:"Conv_original-hafs";
  color:var(--c-gold);padding:14px 0 10px;direction:rtl;line-height:1.7;
}

/* ── Per-ayat ── */
.ayat-block{
  border-top:1px solid var(--c-border);
  padding:14px 0;
  transition:background .2s,border-color .2s;
}
.ayat-block:last-child{
  border-bottom:1px solid var(--c-border);
}
.kata-item.tts-active{
  background:var(--c-green-light);
  border-color:var(--c-green);
}

.ayat-ar{
  direction:rtl;
  font-family:"Conv_original-hafs";
  font-size:28px;
}
.ayat-num{
  display:inline;
  font-family:'Conv_original-hafs';font-size:1em;
  color:var(--c-gold);margin-right:4px;
}
.ayat-tr{
  padding:12px 0px;font-size:14px;
  color:var(--c-muted);line-height:1.5;background:var(--c-bg);
}
.ayat-tr-text{cursor:pointer;}
.ayat-tr-text.tts-active{
  background:var(--c-green-light);
  border-radius:4px;
  padding:2px 4px;
  color:var(--c-text);
}

/* ── Per-kata ── */
.kata-ayat{margin-bottom:16px}
.kata-ayat-num{
  font-size:12px;color:var(--c-muted);
  margin-bottom:10px;padding-bottom:8px;
  border-bottom:1px solid var(--c-border);
  font-weight:500;
}
.kata-grid{display:flex;gap:8px;direction:rtl;justify-content:flex-start;flex-wrap:wrap}
.kata-item{
  background:var(--c-surface);
  border:1px solid var(--c-border);
  border-radius:var(--radius-sm);
  padding:10px 12px;text-align:center;
  cursor:pointer;min-width:64px;
  transition:background .12s,border-color .12s,transform .1s;
}
.kata-item:active{
  background:var(--c-green-light);border-color:var(--c-green);
  transform:scale(.95);
}
.kata-ar{font-family:"Conv_original-hafs";font-size:26px;color:var(--c-text);direction:rtl;line-height:1.5}
.kata-tr{font-size:11px;color:var(--c-muted);margin-top:4px;direction:ltr;line-height:1.3}
.kata-item-num{min-width:48px;cursor:pointer}

/* ── Flashcard ── */
.fc-wrap{padding:4px 0}
.fc-mode-row{display:flex;gap:6px;margin-bottom:12px}
.fc-mode-btn{
  flex:1;padding:10px 6px;font-size:13px;font-weight:500;
  border:1px solid var(--c-border);border-radius:var(--radius-sm);
  background:var(--c-bg);cursor:pointer;color:var(--c-muted);
  transition:all .15s;
}
.fc-mode-btn.on{background:var(--c-green);color:#fff;border-color:var(--c-green)}
.fc-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.fc-nav span{font-size:14px;color:var(--c-muted);font-weight:500}
.fc-btn{
  width:42px;height:42px;border-radius:50%;
  border:1px solid var(--c-border);background:var(--c-surface);
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  color:var(--c-text);font-size:18px;transition:background .12s;
}
.fc-btn:active{background:var(--c-green-light)}
.fc-btn:disabled{opacity:.3;pointer-events:none}
.flashcard{
  background:var(--c-bg);border:1px solid var(--c-border);
  border-radius:var(--radius);min-height:200px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:28px 20px;cursor:pointer;
  box-shadow:0 2px 8px rgba(0,0,0,.06);
  transition:transform .08s;user-select:none;
}
.flashcard:active{transform:scale(.98)}
.fc-front,.fc-back{text-align:center;width:100%}
.fc-ar{font-family:"Conv_original-hafs";font-size:56px;color:var(--c-text);direction:rtl;line-height:1.5}
.fc-hint{font-size:12px;color:var(--c-muted);margin-top:14px;letter-spacing:.02em}
.fc-tr-big{font-size:28px;font-weight:600;color:var(--c-green);margin-bottom:8px;line-height:1.4}
.fc-ar-sm{font-family:"Conv_original-hafs";font-size:26px;color:var(--c-muted);direction:rtl}
.fc-surah{font-size:12px;color:var(--c-muted);margin-top:10px}
.swipe-hint{font-size:11px;color:var(--c-muted);text-align:center;margin-top:10px;opacity:.7}

/* ── Fullscreen flashcard ── */
.fc-fullscreen-btn{
  position:absolute;top:10px;right:10px;
  width:32px;height:32px;border-radius:8px;
  border:1px solid var(--c-border);
  background:var(--c-surface);
  color:var(--c-muted);
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  font-size:15px;z-index:2;
  transition:background .12s,color .12s;
  -webkit-tap-highlight-color:transparent;
}
.fc-fullscreen-btn:active{background:var(--c-green-light);color:var(--c-green)}
.flashcard{position:relative}

/* ── Fullscreen overlay mode ── */
#fc-fullscreen-overlay{
  display:none;
  position:fixed;inset:0;
  background:var(--c-bg);
  z-index:9999;
  flex-direction:column;
  align-items:center;justify-content:center;
  padding:20px;
}
#fc-fullscreen-overlay.active{display:flex}
.fc-fs-close{
  position:fixed;top:14px;right:14px;
  width:36px;height:36px;border-radius:50%;
  border:1px solid var(--c-border);
  background:var(--c-surface);
  color:var(--c-muted);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  font-size:18px;z-index:10;
  -webkit-tap-highlight-color:transparent;
}
.fc-fs-card{
  width:100%;max-width:640px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;
  padding:24px 20px;cursor:pointer;
  user-select:none;
  flex:1;
}
.fc-fs-card .fc-ar{font-size:clamp(72px,14vw,160px)}
.fc-fs-card .fc-tr-big{font-size:clamp(42px,8vw,90px)}
.fc-fs-card .fc-ar-sm{font-size:clamp(22px,4vw,40px)}
.fc-fs-card .fc-hint{font-size:clamp(13px,2vw,18px);margin-top:20px}
.fc-fs-card .fc-surah{font-size:clamp(12px,1.8vw,16px);margin-top:14px}
.fc-fs-nav{
  display:flex;align-items:center;gap:24px;
  padding-bottom:20px;
}
.fc-fs-btn{
  width:52px;height:52px;border-radius:50%;
  border:1px solid var(--c-border);background:var(--c-surface);
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  color:var(--c-text);font-size:22px;
  -webkit-tap-highlight-color:transparent;
}
.fc-fs-btn:active{background:var(--c-green-light)}
.fc-fs-count{font-size:16px;color:var(--c-muted);font-weight:500;min-width:80px;text-align:center}

@media (orientation:landscape){
  #fc-fullscreen-overlay{flex-direction:row;padding:0 24px}
  .fc-fs-card{flex-direction:column;padding:16px 32px}
  .fc-fs-nav{flex-direction:column;height:100%;padding:20px 0}
}


/* ── Latihan result / progress ── */
.lat-progress-bar{height:5px;background:var(--c-border);border-radius:3px;margin-bottom:14px;overflow:hidden}
.lat-progress-fill{height:100%;background:var(--c-green);border-radius:3px;transition:width .3s}
.lat-question-card{
  background:var(--c-surface);border:1px solid var(--c-border);
  border-radius:var(--radius);text-align:center;
  padding:24px 16px;margin-bottom:14px;
}
.lat-choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lat-choice-btn{
  padding:14px 8px;
  border:1px solid var(--c-border);border-radius:var(--radius-sm);
  background:var(--c-bg);color:var(--c-text);
  cursor:pointer;font-size:13px;min-height:60px;
  line-height:1.4;transition:background .12s,border-color .12s;
}
.lat-choice-btn:active{background:var(--c-green-light)}

.badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:10px;background:var(--c-green-light);color:var(--c-green);margin:2px}

/* ── Flashcard Audio playing indicator ── */
.flashcard.fc-audio-playing{
  border-color:var(--c-green);
  box-shadow:0 0 0 2px rgba(15,110,86,.15);
}
/* Extra padding bawah agar konten tidak tertutup player bar */
#content-flashcard{ padding-bottom: 90px; }

/* ── Player Bar ── */
#player-bar{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);
  width:100%;max-width:480px;
  background:var(--c-bg);
  border-top:1px solid var(--c-border);
  box-shadow:0 -2px 12px rgba(0,0,0,.10);
  padding:10px 16px 12px;
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  z-index:100;
  transition:transform .25s ease;
}
#player-bar.hidden{transform:translateX(-50%) translateY(100%)}
.player-info{
  display:flex;flex-direction:column;gap:1px;min-width:0;flex:1;
}
.player-surah{font-size:13px;font-weight:600;color:var(--c-text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player-ayat-label{font-size:11px;color:var(--c-muted)}
.player-controls{display:flex;align-items:center;gap:6px;flex-shrink:0}
.player-btn{
  width:38px;height:38px;border-radius:50%;border:1px solid var(--c-border);
  background:var(--c-surface);color:var(--c-text);
  font-size:14px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:background .12s,border-color .12s,transform .1s;
  -webkit-tap-highlight-color:transparent;
}
.player-btn:active{transform:scale(.92)}
.player-btn-main{
  width:46px;height:46px;font-size:18px;
  background:var(--c-green);color:#fff;border-color:var(--c-green);
}
.player-btn-main.playing{background:var(--c-green)}
.player-btn-auto{font-size:16px}
.player-btn-auto.on{background:var(--c-green);color:#fff;border-color:var(--c-green)}

.fn-block{
  margin-top:8px;border-top:1px dashed var(--c-border);
  padding-top:8px;
}
.fn-toggle{
  display:flex;align-items:center;gap:6px;
  font-size:12px;color:var(--c-gold);font-weight:500;
  cursor:pointer;user-select:none;padding:2px 0;
}
.fn-toggle-icon{font-size:10px;transition:transform .2s;display:inline-block}
.fn-toggle.open .fn-toggle-icon{transform:rotate(180deg)}
.fn-text{
  display:none;margin-top:6px;font-size:12px;
  color:var(--c-muted);line-height:1.6;
  white-space:pre-line;
}
.fn-text.tts-active{
  background:var(--c-green-light);
  border-radius:4px;
  padding:4px 6px;
  color:var(--c-text);
}

.fn-part{
  cursor:pointer;padding:3px 0;
}
.fn-part+.fn-part{margin-top:4px}
.fn-part.tts-active{
  background:var(--c-green-light);
  border-radius:4px;
  padding:3px 6px;
  margin:0 -6px;
  color:var(--c-text);
}
.fn-text.open{display:block}

/* ── Tafsir ── */
.tafsir-block{
  margin-top:8px;border-top:1px dashed var(--c-border);
  padding-top:8px;
}
.tafsir-toggle{
  display:flex;align-items:center;gap:6px;
  font-size:12px;font-weight:500;
  cursor:pointer;user-select:none;padding:2px 0;
}
.tafsir-toggle.ar{color:#7a5a00}
.tafsir-toggle.id{color:var(--c-green)}
.tafsir-toggle-icon{font-size:10px;transition:transform .2s;display:inline-block}
.tafsir-toggle.open .tafsir-toggle-icon{transform:rotate(180deg)}
.tafsir-text{
  display:none;margin-top:6px;font-size:13px;
  line-height:1.75;white-space:pre-line;
}
.tafsir-text.ar{
  direction:rtl;font-family:"Conv_original-hafs";font-size:22px;
  color:var(--c-text);line-height:2;
}
.tafsir-text.id{color:var(--c-muted)}
.tafsir-text.open{display:block}

/* ── Settings: tafsir section divider ── */
.settings-section-label{
  padding:7px 14px 5px;
  font-size:11px;font-weight:600;
  color:var(--c-muted);
  letter-spacing:.06em;text-transform:uppercase;
  border-bottom:1px solid var(--c-border);
  background:var(--c-surface);
}
.tafsir-ar-span{
  cursor:pointer;display:inline;
}
.tafsir-ar-span.tts-active{
  background:var(--c-green-light);
  border-radius:4px;
  padding:2px 4px;
  color:var(--c-text);
}
.tafsir-ar-word{
  display:inline;border-radius:3px;
  transition:background .1s;
}
.tafsir-ar-word.tts-word-active{
  background:var(--c-gold-light);
  outline:1px solid var(--c-gold-border);
  border-radius:3px;
  color:var(--c-text);
}
.tafsir-text.id.tts-active{
  background:var(--c-green-light);
  border-radius:4px;
  padding:2px 4px;
  color:var(--c-text);
}
.tts-id-word{
  display:inline;border-radius:3px;
  transition:background .1s;
}
.tts-id-word.tts-word-active{
  background:var(--c-gold-light);
  outline:1px solid var(--c-gold-border);
  border-radius:3px;
  color:var(--c-text);
}
  font-size:10px;padding:2px 7px;border-radius:10px;
  font-weight:600;flex-shrink:0;display:inline-block;
}
.badge-ar{background:#FFF8E1;color:#7a5a00;border:1px solid #e8c84a}
.badge-id{background:var(--c-green-light);color:var(--c-green);border:1px solid #9FE1CB}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet">

<h2 class="sr-only" style="position:absolute;left:-9999px">Aplikasi Al-Qur'an per kata — Surat 100 sampai 114</h2>
<div class="app" id="app">
  <div class="header">
    <div>
      <div class="header-title">Al-Qur'an Per Kata</div>
      <div class="header-sub">Surat 1–114 · Baca &amp; Latihan</div>
    </div>
    <div class="header-icon">📖</div>
  </div>
  <div class="tabs">
    <div class="tab active" id="tab-baca" onclick="switchTab('baca')">Baca <span class="tab-chevron" id="chv-baca">▲</span></div>
    <div class="tab" id="tab-latihan" onclick="switchTab('latihan')">Latihan <span class="tab-chevron" id="chv-latihan">▲</span></div>
    <div class="tab" id="tab-flashcard" onclick="switchTab('flashcard')">Flashcard <span class="tab-chevron" id="chv-flashcard">▲</span></div>
  </div>
  <div class="content" id="content-baca">
    <div id="baca-settings-body" class="settings-body">
    <div id="baca-settings" class="settings-card">
      <div class="settings-row">
        <label>Surat</label>
        <select id="sel-surah" onchange="updateAyatRange();renderBaca()"></select>
      </div>
      <div class="settings-row">
        <label>Ayat</label>
        <div class="ayat-range">
          <select id="ayat-from" onchange="renderBaca()"></select>
          <span class="ayat-sep">s/d</span>
          <select id="ayat-to" onchange="renderBaca()"></select>
        </div>
      </div>
      <div class="settings-row">
        <label>Tampilan</label>
        <div class="toggle-group">
          <div class="tgl on" id="tgl-ayat" onclick="toggleMode('ayat')">Per ayat</div>
          <div class="tgl on" id="tgl-kata" onclick="toggleMode('kata')">Per kata</div>
        </div>
      </div>
      <div class="settings-row">

function buildAyatOptions(fromId,toId,jml,fromVal,toVal){
  const fromSel=document.getElementById(fromId);
  const toSel=document.getElementById(toId);
  fromSel.innerHTML='';
  toSel.innerHTML='';
  for(let i=1;i<=jml;i++){
    fromSel.innerHTML+=`<option value="${i}"${i===(fromVal||1)?'selected':''}>${i}</option>`;
    toSel.innerHTML+=`<option value="${i}"${i===(toVal||jml)?'selected':''}>${i}</option>`;
  }
}

function updateAyatRange(){
  const s=DATA[document.getElementById('sel-surah').value];
  buildAyatOptions('ayat-from','ayat-to',s.jml,1,s.jml);
}

let latOrder='urut';
function toggleLatOrder(v){
  latOrder=v;
  document.getElementById('tgl-lat-urut').className='tgl'+(v==='urut'?' on':'');
  document.getElementById('tgl-lat-acak').className='tgl'+(v==='acak'?' on':'');
}
function toggleLatScope(){
  const scope=document.getElementById('lat-scope').value;
  const isAll=(scope==='random-all');
  document.getElementById('lat-surah-row').style.display=isAll?'none':'';
  document.getElementById('lat-ayat-row').style.display=isAll?'none':'';
  document.getElementById('lat-order-row').style.display=isAll?'none':'';
  updateLatJumlah();
}

function toggleLatLevel(){
  updateLatJumlah();
}

function updateLatRange(){
  const s=DATA[document.getElementById('lat-surah').value];
  buildAyatOptions('lat-from','lat-to',s.jml,1,s.jml);
  updateLatJumlah();
}

function updateLatJumlah(){
  const scope=document.getElementById('lat-scope').value;
  const level=document.getElementById('lat-level').value;
  let count=0;
  if(scope==='random-all'){
    for(let sId=1;sId<=114;sId++){
      const s=DATA[sId];
      if(!s) continue;
      if(level==='kata' && typeof KATA_DATA!=='undefined' && KATA_DATA[sId]){
        Object.values(KATA_DATA[sId]).forEach(words=>{ count+=words.filter(w=>w.tr).length; });
      } else {
        count+=s.jml;
      }
    }
  } else {
    const sId=+document.getElementById('lat-surah').value;
    const s=DATA[sId];
    if(!s) return;
    const fr=+document.getElementById('lat-from').value||1;
    const to=+document.getElementById('lat-to').value||s.jml;
    const filtered=s.ayat.filter(a=>a.n>=fr&&a.n<=to);
    if(level==='kata' && typeof KATA_DATA!=='undefined' && KATA_DATA[sId]){
      filtered.forEach(a=>{
        const words=KATA_DATA[sId][a.n];
        if(words) count+=words.filter(w=>w.tr).length;
      });
    } else {
      count=filtered.length;
    }
  }
  document.getElementById('lat-jumlah').value=count||'';
}







let _ttsVoices=[];
function _loadVoices(){
  _ttsVoices=window.speechSynthesis.getVoices();
}
if('speechSynthesis' in window){
  _loadVoices();
  window.speechSynthesis.onvoiceschanged=_loadVoices;
}

function _pickVoice(lang, priorityKw, femaleKw){
  const list=_ttsVoices.filter(v=>v.lang.startsWith(lang));
  if(priorityKw){
    const hit=list.find(v=>priorityKw.some(k=>v.name.toLowerCase().includes(k)));
    if(hit) return hit;
  }
  const male=list.find(v=>!femaleKw.some(k=>v.name.toLowerCase().includes(k)));
  return male||list[0]||null;
}

function _setActive(elOrNull, cls){
  const c=cls||'tts-active';
  document.querySelectorAll('.'+c).forEach(el=>el.classList.remove(c));
  if(elOrNull) elOrNull.classList.add(c);
}

// Auto-calibration: ukur charsPerSec aktual dari TTS pertama yang selesai.
// Disimpan di localStorage agar tidak perlu kalibrasi ulang setiap buka app.
// Kalibrasi CPS dipisah per bahasa: AR dan ID punya kecepatan berbeda
let _calibratedCPS = { ar: null, id: null };
(function(){
  try {
    const ar = parseFloat(localStorage.getItem('tts_cps_ar'));
    const id = parseFloat(localStorage.getItem('tts_cps_id'));
    if(ar > 0) _calibratedCPS.ar = ar;
    if(id > 0) _calibratedCPS.id = id;
  } catch(e){}
})();

function _startCalibration(utt, textLength, lang){
  // Kalibrasi hanya untuk Android (timer fallback), web pakai onboundary native
  if(!_isAndroid || _calibratedCPS[lang]) return;
  const t0 = Date.now();
  const origOnend = utt.onend;
  utt.onend = function(e){
    const elapsed = (Date.now() - t0) / 1000;
    if(elapsed > 0.3 && textLength > 5){
      _calibratedCPS[lang] = textLength / elapsed;
      try { localStorage.setItem('tts_cps_' + lang, _calibratedCPS[lang]); } catch(ex){}
    }
    if(origOnend) origOnend.call(this, e);
  };
}

// Group wordSpans into punctuation-delimited segments.
// Each segment = array of spans up to (and including) a span whose word ends with punctuation.
function _groupByPunctuation(wordSpans){
  // Returns [{spans, pauseExtra}] where pauseExtra = bonus ms to add AFTER last word of group
  // Heavy pause : titik, tanda tanya, tanda seru, ellipsis → +900ms (kalimat selesai)
  // Light pause : koma, titik dua, titik koma → +700ms (jeda napas, kalimat lanjut)
  // No punct    : no extra pause
  const heavyRe = /[.?!؟…]$/;
  const lightRe = /[,;:،؛]$/;
  const anyRe   = /[.;,:?!،؛؟…]$/;
  const groups = [];
  let cur = [];
  wordSpans.forEach(span => {
    cur.push(span);
    const w = (span.dataset.w || span.textContent).trim();
    if(anyRe.test(w)){
      const pauseExtra = heavyRe.test(w) ? 900 : 700;
      groups.push({spans: cur, pauseExtra});
      cur = [];
    }
  });
  if(cur.length) groups.push({spans: cur, pauseExtra: 0});
  return groups;
}

const _isAndroid = /android/i.test(navigator.userAgent);

function _wordHighlighter(wordSpans, utt, cleanText, lang){
  const spanWords = Array.from(wordSpans).map(s => s.dataset.w || s.textContent);

  if(!_isAndroid){
    // ── Web/Desktop: HANYA onboundary native, tidak ada timer sama sekali ──
    utt.onboundary = e => {
      if(e.name !== 'word') return;
      wordSpans.forEach(s => s.classList.remove('tts-word-active'));
      let offset = 0;
      for(let i = 0; i < wordSpans.length; i++){
        const wlen = spanWords[i].length + 1;
        if(e.charIndex >= offset && e.charIndex < offset + wlen){
          wordSpans[i].classList.add('tts-word-active');
          break;
        }
        offset += wlen;
      }
    };
    return () => { wordSpans.forEach(s => s.classList.remove('tts-word-active')); };
  }

  // ── Android: timer fallback (onboundary tidak didukung) ──
  let timerFallback = null;
  let gateTimer = null;

  const rate = utt.rate || 0.75;
  const baseCPS = (_calibratedCPS[lang || 'id'] || (lang === 'ar' ? 4.0 : 4.5));
  const charsPerSec = baseCPS * rate;
  const minWordMs = lang === 'ar' ? 80 : 100;
  const maxWordMs = lang === 'ar' ? 500 : 700;
  const minSegMs  = lang === 'ar' ? 400 : 700;

  const groups = _groupByPunctuation(wordSpans);
  const schedule = [];
  groups.forEach(({spans: group, pauseExtra}) => {
    const bases = group.map(s => {
      const w = s.dataset.w || s.textContent;
      return Math.min(maxWordMs, Math.max(minWordMs, Math.round((w.length / charsPerSec) * 1000)));
    });
    const segMs = bases.reduce((a, b) => a + b, 0);
    const adjustPerWord = Math.round(Math.max(0, minSegMs - segMs) / group.length);
    bases.forEach((b, i) => {
      const isLast = (i === bases.length - 1);
      schedule.push(Math.min(maxWordMs, Math.max(minWordMs, b + adjustPerWord)) + (isLast ? pauseExtra : 0));
    });
  });

  const startFallback = () => {
    let idx = 0;
    const tick = () => {
      if(idx >= wordSpans.length) return;
      wordSpans.forEach(s => s.classList.remove('tts-word-active'));
      wordSpans[idx].classList.add('tts-word-active');
      timerFallback = setTimeout(tick, schedule[idx++] || minWordMs);
    };
    tick();
  };

  // Mulai tick saat onstart fired (suara sudah keluar) + offset 0ms
  utt.onstart = () => {
    if(gateTimer){ clearTimeout(gateTimer); gateTimer = null; }
    gateTimer = setTimeout(startFallback, 0);
  };
  // Safety fallback jika onstart tidak fired
  gateTimer = setTimeout(startFallback, 600);

  return () => {
    if(gateTimer){ clearTimeout(gateTimer); gateTimer = null; }
    if(timerFallback){ clearTimeout(timerFallback); timerFallback = null; }
    wordSpans.forEach(s => s.classList.remove('tts-word-active'));
  };
}

// ── Segmented TTS: speak per-punctuation segment, highlight follows each segment ──
function _speakSegmented(wordSpans, lang, blockEl){
  if(!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();

  const groups = _groupByPunctuation(Array.from(wordSpans));
  if(!groups.length) return;

  const isAr = lang === 'ar';
  const femaleArKw = ['female','woman','samira','laila','zira'];
  const femaleIdKw = ['female','woman','siti','wanita'];
  const voice = isAr
    ? _pickVoice('ar', null, femaleArKw)
    : _pickVoice('id', ['ardi'], femaleIdKw);

  // Clear all highlights
  const clearAll = () => {
    wordSpans.forEach(s => s.classList.remove('tts-word-active'));
    _setActive(null,'tts-active');
  };

  if(blockEl) _setActive(blockEl,'tts-active');

  let segIdx = 0;
  const speakNext = () => {
    if(segIdx >= groups.length){ clearAll(); return; }
    const {spans: segSpans, pauseExtra} = groups[segIdx++];
    const segText = segSpans.map(s => s.dataset.w || s.textContent).join(' ');

    const utt = new SpeechSynthesisUtterance(segText);
    utt.lang = isAr ? 'ar-SA' : 'id-ID';
    utt.rate = 0.75;
    utt.pitch = 1;
    utt.voice = voice;

    // Highlight segmen ini
    wordSpans.forEach(s => s.classList.remove('tts-word-active'));
    segSpans.forEach(s => s.classList.add('tts-word-active'));

    // Word-level highlight dalam segmen (Android timer / web onboundary)
    const cleanupHL = _wordHighlighter(segSpans, utt, segText, lang);

    _startCalibration(utt, segText.length, lang);

    utt.onend = () => {
      cleanupHL();
      // Jeda antar segmen sesuai pauseExtra, lalu speak segmen berikutnya
      setTimeout(speakNext, pauseExtra);
    };

    window.speechSynthesis.speak(utt);
  };

  speakNext();
}

function speakAr(text, blockEl){
  if(!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();

  // Tafsir Arab: ada wordSpans → segmented
  let wordSpans = null;
  if(blockEl){
    if(blockEl.classList.contains('tafsir-ar-span')){
      wordSpans = blockEl.querySelectorAll('.tafsir-ar-word');
    }
  }

  if(wordSpans && wordSpans.length){
    _speakSegmented(wordSpans, 'ar', blockEl);
    return;
  }

  // Fallback: satu kata (kata-item) — speak langsung
  const utt = new SpeechSynthesisUtterance(text);
  utt.lang = 'ar-SA';
  utt.rate = 0.75;
  utt.pitch = 1;
  utt.voice = _pickVoice('ar', null, ['female','woman','samira','laila','zira']);
  utt.onend = () => _setActive(null,'tts-active');
  if(blockEl) _setActive(blockEl,'tts-active');
  _startCalibration(utt, text.length, 'ar');
  window.speechSynthesis.speak(utt);
}

function speakId(text, blockEl){
  if(!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();

  const wordSpans = blockEl && blockEl.querySelectorAll('.tts-id-word');

  if(wordSpans && wordSpans.length){
    _speakSegmented(wordSpans, 'id', blockEl);
    return;
  }

  // Fallback: tidak ada spans
  const clean = text.replace(/^\s*\[\d+\]\.?\s*/,'').replace(/\[\d+\]/g,'').replace(/[()]/g,'').replace(/["\u201C\u201D\u2018\u2019]/g,'').replace(/`/g,"'").trim();
  const utt = new SpeechSynthesisUtterance(clean);
  utt.lang = 'id-ID';
  utt.rate = 0.75;
  utt.pitch = 1;
  utt.voice = _pickVoice('id', ['ardi'], ['female','woman','siti','wanita']);
  utt.onend = () => _setActive(null,'tts-active');
  if(blockEl) _setActive(blockEl,'tts-active');
  _startCalibration(utt, clean.length, 'id');
  window.speechSynthesis.speak(utt);
}


function toArabicNum(n){

// Cache: {filename: data_object | 'loading' | 'error'}
const tafsirCache = {};

// Active selections
let tafsirArFile = '';
let tafsirIdFile = '';

// Split As-Sa'di grouped tafsir text per ayat
// AR markers: {6}, {8 ـ 9}   ID markers: (6), (8-9)
function splitAssaadi(plainText, ayahKeys, lang) {
  const surahNum = ayahKeys[0].split(':')[0];
  const result = {};
  let parts;
  if (lang === 'ar') {
    // split on {N} or {N ـ M}
    parts = plainText.split(/(?=\{\d[\d\s\u0640\-]*\})/);
  } else {
    // split on (N) or (N-M) — only at word boundary to avoid false matches
    parts = plainText.split(/(?=\(\d[\d\s\-]*\))/);
  }
  parts.forEach(part => {
    part = part.trim();
    if (!part) return;
    let m;
    if (lang === 'ar') {
      m = part.match(/^\{(\d+)(?:[\s\u0640\-]+(\d+))?\}/);
    } else {
      m = part.match(/^\((\d+)(?:[\s\-]+(\d+))?\)/);
    }
    if (!m) return;
    const n1 = parseInt(m[1]), n2 = parseInt(m[2] || m[1]);
    for (let n = n1; n <= n2; n++) {
      const k = surahNum + ':' + n;
      if (ayahKeys.includes(k)) result[k] = part;
    }
  });
  return result;
}

function onTafsirChange(lang) {
  const file = document.getElementById('sel-tafsir-' + lang).value;
  if (lang === 'ar') tafsirArFile = file;
  else tafsirIdFile = file;

  if (file && !tafsirCache[file]) {
    tafsirCache[file] = 'loading';
    fetch(file)
      .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(data => { tafsirCache[file] = data; renderBaca(); })
      .catch(() => { tafsirCache[file] = 'error'; renderBaca(); });
  }
  renderBaca();
}

function toggleTafsirItem(id, lang) {
  const el = document.getElementById('tafsir-text-' + lang + '-' + id);
  const tog = document.getElementById('tafsir-tog-' + lang + '-' + id);
  if (!el) return;
  const open = el.classList.toggle('open');
  tog.classList.toggle('open', open);
}

function buildTafsirBlock(sId, ayatN, lang, file) {
  if (!file) return '';
  const cache = tafsirCache[file];
  const key = sId + ':' + ayatN;
  const langClass = lang; // 'ar' or 'id'
  const icon = lang === 'ar' ? '📖' : '📝';
  const baseLabel = lang === 'ar' ? 'Tafsir Arab' : 'Tafsir Indonesia';
  const selEl = document.getElementById('sel-tafsir-' + lang);
  const selectedText = selEl && selEl.selectedIndex > 0 ? selEl.options[selEl.selectedIndex].text : '';
  const label = selectedText ? baseLabel + ' (' + selectedText + ')' : baseLabel;
  const id = sId + '-' + ayatN;

  let bodyHtml = '';
  let rangeInfo = '';
  if (!cache || cache === 'loading') {
    bodyHtml = `<div class="tafsir-text ${langClass} open" style="font-size:12px;color:var(--c-muted)">Memuat tafsir…</div>`;
  } else if (cache === 'error') {
    bodyHtml = `<div class="tafsir-text ${langClass} open" style="font-size:12px;color:var(--c-muted)">Gagal memuat tafsir.</div>`;
  } else {
    // Resolve pointer (some entries are string refs to another key)
    let entry = cache[key];
    if (typeof entry === 'string') entry = cache[entry];
    if (!entry || !entry.text) return '';
    // Strip HTML tags — some tafsir files (e.g. As-Sa'di) contain raw HTML markup
    const tmp = document.createElement('div');
    tmp.innerHTML = entry.text;
    const plainText = (tmp.textContent || tmp.innerText || '').replace(/\s+/g,' ').trim();
    if (!plainText) return '';

    // If entry covers multiple ayat (e.g. As-Sa'di), try to split per ayat
    let displayText = plainText;
    if (entry.ayah_keys && entry.ayah_keys.length > 1) {
      const split = splitAssaadi(plainText, entry.ayah_keys, lang);
      const thisKey = sId + ':' + ayatN;
      if (split[thisKey]) {
        displayText = split[thisKey];
      } else {
        // fallback: show range info if can't split
        const first = entry.ayah_keys[0].split(':')[1];
        const last  = entry.ayah_keys[entry.ayah_keys.length - 1].split(':')[1];
        rangeInfo = ` <span style="font-size:10px;opacity:.7">(ayat ${first}–${last})</span>`;
      }
    }

    if (lang === 'ar') {
      // Split text into words, wrap each in a span for word-level TTS highlight
      const words = displayText.split(/\s+/).filter(Boolean);
      const wordSpansHtml = words.map(w =>
        `<span class="tafsir-ar-word" data-w="${w.replace(/"/g,'&quot;')}">${w}</span>`
      ).join(' ');
      bodyHtml = `<div class="tafsir-text ar" id="tafsir-text-ar-${id}"
        ><span class="tafsir-ar-span" data-ar="${displayText.replace(/"/g,'&quot;')}" onclick="speakAr(this.dataset.ar,this)">${wordSpansHtml}</span></div>`;
    } else {
      // Clean teks ID sebelum dibuat span (sama dengan proses di speakId)
      const idClean = displayText.replace(/^\s*\[\d+\]\.?\s*/,'').replace(/\[\d+\]/g,'').replace(/[()]/g,'').replace(/["\u201C\u201D\u2018\u2019]/g,'').replace(/`/g,"'").trim();
      const idWords = idClean.split(/\s+/).filter(Boolean).map(w =>
        `<span class="tts-id-word" data-w="${w.replace(/"/g,'&quot;')}">${w}</span>`
      ).join(' ');
      bodyHtml = `<div class="tafsir-text id" id="tafsir-text-id-${id}"
        onclick="speakId('',this)"
        >${idWords}</div>`;
    }
  }

  return `<div class="tafsir-block">
    <div class="tafsir-toggle ${langClass}" id="tafsir-tog-${langClass}-${id}"
      onclick="toggleTafsirItem('${id}','${langClass}')">
      <span>${icon} ${label}${rangeInfo||''}</span>
      <span class="tafsir-toggle-icon">▼</span>
    </div>
    ${bodyHtml}
  </div>`;
}

      }
      if(showTrAyat&&!showAyat&&!showKata){
        // terjemahan saja tanpa tampilan arab

      }
      if(showTrAyat){
        // Clean terjemahan dulu (sama dengan yang akan di-speak) sebelum dibuat span
        const trClean = a.tr.replace(/^\s*\[\d+\]\.?\s*/,'').replace(/\[\d+\]/g,'').replace(/[()]/g,'').replace(/["\u201C\u201D\u2018\u2019]/g,'').replace(/`/g,"'").trim();
        const trWords = trClean.split(/\s+/).filter(Boolean).map(w=>
          `<span class="tts-id-word" data-w="${w.replace(/"/g,'&quot;')}">${w}</span>`

          });
          html+=`<div class="kata-item kata-item-num" data-sidx="${sId}" data-ayat="${a.n}" onclick="playAyatAudio(this)" style="cursor:pointer"><div class="kata-ar" style="color:var(--c-gold)">${toArabicNum(a.n)}</div></div>`;
          html+=`</div>`;
        }
      }
      if(showFn && a.fn){
        const fnId=`${sId}-${a.n}`;
        html+=`<div class="fn-block">
          <div class="fn-toggle" id="fn-tog-${fnId}" onclick="toggleFnItem('${fnId}')">
            <span>📝 Catatan kaki</span>
            <span class="fn-toggle-icon">▼</span>
          </div>
          <div class="fn-text" id="fn-text-${fnId}">${
            a.fn.split(/\n(?=\[\d+\])/).map((part,i)=>{
              const partClean = part.replace(/^\s*\[\d+\]\.?\s*/,'').replace(/\[\d+\]/g,'').replace(/[()]/g,'').replace(/["\u201C\u201D\u2018\u2019]/g,'').replace(/`/g,"'").trim();
              const partWords = partClean.split(/\s+/).filter(Boolean).map(w=>
                `<span class="tts-id-word" data-w="${w.replace(/"/g,'&quot;')}">${w}</span>`
              ).join(' ');
              return `<div class="fn-part" onclick="speakId('',this)">${partWords}</div>`;
            }).join('')
          }</div>
        </div>`;
      }
      html += buildTafsirBlock(sId, a.n, 'ar', tafsirArFile);
      html += buildTafsirBlock(sId, a.n, 'id', tafsirIdFile);
      html+=`</div>`;
    });
  }
  document.getElementById('baca-output').innerHTML=html;
}

// LATIHAN
let latState={};
function startLatihan(){
  const scope=document.getElementById('lat-scope').value;
  const mode=document.getElementById('lat-mode').value;
  const level=document.getElementById('lat-level').value;
  let ayats=[];

  function pushAyat(sId, ayatList){
    const s=DATA[sId];
    if(!s) return;
    if(level==='kata' && typeof KATA_DATA!=='undefined' && KATA_DATA[sId]){
      ayatList.forEach(a=>{
        const words=KATA_DATA[sId][a.n];
        if(words && words.length) words.forEach(w=>{if(w.tr) ayats.push({ar:w.ar,tr:w.tr,ayat:a.n,surah:s.name});});
      });
    } else {
      ayatList.forEach(a=>ayats.push({ar:a.ar,tr:a.tr,ayat:a.n,surah:s.name}));
    }
  }

  if(scope==='random-all'){
    for(let sId=1;sId<=114;sId++){
      const s=DATA[sId];
      if(s) pushAyat(sId, s.ayat);
    }
    ayats.sort(()=>Math.random()-.5);
  } else {
    const sId=+document.getElementById('lat-surah').value;
    const s=DATA[sId];
    const fr=+document.getElementById('lat-from').value;
    const to=+document.getElementById('lat-to').value;
    const filtered=s.ayat.filter(a=>a.n>=fr&&a.n<=to);
    pushAyat(sId, filtered);
    if(latOrder==='acak') ayats.sort(()=>Math.random()-.5);
  }

  if(!ayats.length){ayats=[{ar:'—',tr:'Tidak ada data',ayat:1,surah:'?'}];}
  const jumlahEl=document.getElementById('lat-jumlah');
  if(!jumlahEl.value||+jumlahEl.value>ayats.length) jumlahEl.value=ayats.length;
  ayats=ayats.slice(0,Math.max(1,+jumlahEl.value));
  latState={kata:ayats,mode,idx:0,score:0,total:ayats.length,answered:false};
  renderLatihan();
}

function renderLatihan(){
  const {kata,mode,idx,score,total}=latState;
  if(idx>=total){
    document.getElementById('latihan-output').innerHTML=`
      <div class="settings-card" style="text-align:center;padding:24px">
        <div style="font-size:32px;margin-bottom:8px">🎉</div>
        <div style="font-size:18px;font-weight:500;color:var(--c-green);margin-bottom:4px">${score} / ${total}</div>
        <div style="font-size:13px;color:var(--c-muted)">Latihan selesai!</div>
        <button class="apply-btn" onclick="startLatihan()" style="margin-top:16px">Ulangi</button>
      </div>`;
    return;
  }
  const k=kata[idx];
  const progress=Math.round((idx/total)*100);
  let Q,A;
  if(mode==='ar2tr'){Q=k.ar;A=k.tr;}
  else{Q=k.tr;A=k.ar;}

  // generate choices
  const pool=latState.kata.filter((_,i)=>i!==idx);
  const shuffled=[...pool].sort(()=>Math.random()-.5).slice(0,Math.min(3,pool.length));
  const choices=shuffled.map(c=>mode==='ar2tr'?c.tr:c.ar);
  choices.push(A);
  choices.sort(()=>Math.random()-.5);

  let html=`
    <div style="margin-bottom:14px">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
        <span style="font-size:13px;color:var(--c-muted);font-weight:500">${idx+1} / ${total}</span>
        <span style="font-size:13px;color:var(--c-green);font-weight:600">Skor: ${score}</span>
      </div>
      <div class="lat-progress-bar">
        <div class="lat-progress-fill" style="width:${progress}%"></div>
      </div>
    </div>
    <div class="lat-question-card">
      <div style="font-size:12px;color:var(--c-muted);margin-bottom:12px">Ayat ${k.ayat} · ${k.surah}</div>
      <div style="${mode==='ar2tr'?"font-family:'Conv_original-hafs';font-size:34px;direction:rtl;":"font-family:var(--font-sans,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif);font-size:18px;font-weight:500;direction:ltr;"}color:var(--c-text);line-height:1.6">${Q}</div>
    </div>
    <div class="lat-choices" id="choices">`;
  choices.forEach((c,i)=>{
    const isAr=mode==='tr2ar';
    const choiceStyle=isAr
      ? "font-family:'Conv_original-hafs';font-size:32px;direction:rtl;"
      : "font-size:16px;direction:ltr;";
    html+=`<button onclick="checkAnswer(${i},'${encodeURIComponent(c)}','${encodeURIComponent(A)}')" 
      class="lat-choice-btn" style="${choiceStyle}" id="choice-${i}">
      ${c}</button>`;
  });
  html+=`</div>`;
  document.getElementById('latihan-output').innerHTML=html;
}

function checkAnswer(i,chosen,correct){
  const c=decodeURIComponent(chosen),r=decodeURIComponent(correct);
  const btns=document.querySelectorAll('[id^=choice-]');
  btns.forEach((b,j)=>{
    if(b.textContent.trim()===r) b.style.background='var(--c-background-success,#E1F5EE)',b.style.borderColor='var(--c-green)';
  });
  if(c===r){
    latState.score++;
    btns[i].style.background='var(--c-green)';
    btns[i].style.color='#fff';
  } else {
    btns[i].style.background='var(--color-background-danger,#FCEBEB)';
    btns[i].style.borderColor='red';
  }
  btns.forEach(b=>b.disabled=true);
  setTimeout(()=>{latState.idx++;renderLatihan();},900);
}

        if(fr!==null && (a.n<fr||a.n>to)) return;
        const words=KATA_DATA[id][a.n];
        if(words && words.length){
          words.forEach((w,wi)=>{
            if(w.tr) cards.push({ar:w.ar,tr:w.tr,ref:`Q.S ${s.name} : ${a.n}`,surah:s.name,sId:id,ayatN:a.n,wIdx:wi+1});
          });
        }
      });
    } else {
      s.ayat.forEach(a=>cards.push({ar:a.ar,tr:a.tr,ref:`Q.S ${s.name} : ${a.n}`,surah:s.name,sId:id,ayatN:a.n}));
    }
  });
  if(fcOrder==='acak') cards.sort(()=>Math.random()-.5);
  const fcJumlahEl=document.getElementById('fc-jumlah');
  if(!fcJumlahEl.value||+fcJumlahEl.value>cards.length) fcJumlahEl.value=cards.length;
  cards=cards.slice(0,Math.max(1,+fcJumlahEl.value));
  fc={cards,idx:0,flipped:false,done:[]};
  renderFC();
  _playerFcUpdateUI();
}

let _fcTouchHandled=false;
function fcClick(e){
  if(e.target.closest && e.target.closest('.fc-fullscreen-btn')) return;

function fcTouch(e){
  // Jangan intercept touch jika berasal dari tombol fullscreen
  if(e.target.closest && e.target.closest('.fc-fullscreen-btn')) return;
  const startX=e.touches[0].clientX;
  const startY=e.touches[0].clientY;
  const card=e.currentTarget;
  card.ontouchend=function(ev){
    card.ontouchend=null;
    const dx=ev.changedTouches[0].clientX-startX;
    const dy=ev.changedTouches[0].clientY-startY;
    _fcTouchHandled=true;
    if(Math.abs(dx)>40&&Math.abs(dx)>Math.abs(dy)){
      // swipe — lock jika audio sedang berjalan
      if(_fcAudio && !_fcAudio.paused) return;
      if(dx<0)fcNext();else fcPrev();
    } else if(Math.abs(dx)<10&&Math.abs(dy)<10){
      flipFC();
    }
  };
  e.preventDefault();
}

function switchTab(t){
  function applyTab(){
    if(activeTab===t){
      toggleActiveSettings();
      return;
    }
    activeTab=t;
    ['baca','latihan','flashcard'].forEach(x=>{
      document.getElementById('content-'+x).style.display=x===t?'block':'none';
      document.getElementById('tab-'+x).className='tab'+(x===t?' active':'');
    });
    const prefix=getPrefix(t);
    const body=document.getElementById(prefix+'-settings-body');
    if(body && !body.classList.contains('open')){
      body.classList.add('open');
    }
    ['baca','latihan','flashcard'].forEach(x=>{
      const chv=document.getElementById('chv-'+x);
      if(!chv) return;
      chv.style.display=x===t?'inline-block':'none';
      if(x===t){
        const isOpen=document.getElementById(getPrefix(x)+'-settings-body').classList.contains('open');
        chv.classList.toggle('open',isOpen);
      }
    });
  }

  // Jika sudah di atas (dalam 60px dari top), langsung apply
  if(window.scrollY < 60){
    applyTab();
    return;
  }

  // Scroll smooth ke paling atas dulu, baru apply tab setelah sampai
  window.scrollTo({top:0, behavior:'smooth'});
  let done=false;
  function onScroll(){
    clearTimeout(window._tabScrollTimer);
    window._tabScrollTimer=setTimeout(()=>{
      if(done) return;
      done=true;
      window.removeEventListener('scroll', onScroll);
      applyTab();
    }, 100);
  }
  window.addEventListener('scroll', onScroll, {passive:true});
  // Fallback jika scroll selesai sangat cepat atau tidak memicu event
  setTimeout(()=>{
    if(!done){ done=true; window.removeEventListener('scroll', onScroll); applyTab(); }
  }, 800);
}

// ── Recitation Audio ────────────────────────────────────────────────────────
// Cache per file: { filename: data | 'loading' | 'error' }
const _recCache = {};
const _recCallbacks = {}; // { filename: [cb, cb, ...] }

function _loadRecitationData(file, cb) {
  if (!file) return;
  if (_recCache[file] && _recCache[file] !== 'loading') {
    if (_recCache[file] !== 'error') cb(_recCache[file]);
    return;
  }
  if (!_recCallbacks[file]) _recCallbacks[file] = [];
  if (cb) _recCallbacks[file].push(cb);
  if (_recCache[file] === 'loading') return;
  _recCache[file] = 'loading';
  fetch(file)
    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(data => {
      _recCache[file] = data;
      (_recCallbacks[file] || []).forEach(fn => fn(data));
      _recCallbacks[file] = [];
    })
    .catch(err => {
      console.warn('Gagal memuat recitation:', file, err);
      _recCache[file] = 'error';
      _recCallbacks[file] = [];
    });
}

function _currentQariFile() {
  const sel = document.getElementById('sel-qari');
  return sel ? sel.value : '';
}

function onQariChange() {
  // Stop audio yang sedang berjalan, reset cache tidak perlu (keep multi-cache)
  _stopRecAudio();
  // Preload file baru di background

  // Sinkron ke fc-qari
  const fcSel = document.getElementById('fc-qari');

}

// Audio instance aktif
let _recAudio = null;
let _recActiveEl = null;

function _clearRecActive() {
  document.querySelectorAll('.kata-item.tts-active').forEach(el => el.classList.remove('tts-active'));
  _recActiveEl = null;
}

function _stopRecAudio() {
  if (_recAudio) {
    _recAudio.pause();
    _recAudio.src = '';
    _recAudio = null;
  }
  _clearRecActive();
}

// Dipanggil saat kata-item diklik → putar satu kata saja (seek ke segmennya)
function playKataAudio(el) {
  const sId   = el.dataset.sidx;
  const ayatN = el.dataset.ayat;
  const wIdx  = parseInt(el.dataset.widx);
  const key   = sId + ':' + ayatN;
  const file  = _currentQariFile();
  if (!file) return;

  if (_recActiveEl === el) { _stopRecAudio(); return; }
  _stopRecAudio();

  _loadRecitationData(file, function(data) {
    const entry = data[key];
    if (!entry || !entry.segments) return;
    const seg = entry.segments.find(s => s[0] === wIdx);
    if (!seg) return;

    const startMs = seg[1], endMs = seg[2];
    el.classList.add('tts-active');
    _recActiveEl = el;

    const audio = new Audio(entry.audio_url);
    _recAudio = audio;
    audio.addEventListener('loadedmetadata', () => {
      audio.currentTime = startMs / 1000;
      audio.play().catch(() => _stopRecAudio());
    });
    audio.addEventListener('timeupdate', () => {
      if (audio.currentTime * 1000 >= endMs) {
        audio.pause();
        _clearRecActive();
        _recAudio = null;
      }
    });
    audio.addEventListener('error', () => _stopRecAudio());
  });
}

// Dipanggil saat kata-item-num diklik → putar ayat penuh, highlight kata per segment
function playAyatAudio(numEl) {
  const sId   = numEl.dataset.sidx;
  const ayatN = numEl.dataset.ayat;
  const key   = sId + ':' + ayatN;
  const file  = _currentQariFile();
  if (!file) return;

  if (_recActiveEl === numEl) { _stopRecAudio(); return; }
  _stopRecAudio();

  _loadRecitationData(file, function(data) {
    const entry = data[key];
    if (!entry || !entry.segments || !entry.segments.length) return;

    const segments = entry.segments;
    const grid = numEl.parentElement;
    const kataItems = Array.from(grid.querySelectorAll('.kata-item:not(.kata-item-num)'));

    _recActiveEl = numEl;
    numEl.classList.add('tts-active');

    const audio = new Audio(entry.audio_url);
    _recAudio = audio;
    let activeSegIdx = -1;

    audio.addEventListener('loadedmetadata', () => {
      audio.currentTime = 0;
      audio.play().catch(() => _stopRecAudio());
    });

    audio.addEventListener('timeupdate', () => {
      const nowMs = audio.currentTime * 1000;
      let newSegIdx = -1;
      for (let i = 0; i < segments.length; i++) {
        if (nowMs >= segments[i][1] && nowMs < segments[i][2]) { newSegIdx = i; break; }
      }
      if (newSegIdx !== activeSegIdx) {
        activeSegIdx = newSegIdx;
        kataItems.forEach(el => el.classList.remove('tts-active'));
        if (newSegIdx >= 0) {
          const wi = segments[newSegIdx][0] - 1;
          if (kataItems[wi]) kataItems[wi].classList.add('tts-active');
        }
      }
    });

    audio.addEventListener('ended', () => { _clearRecActive(); _recAudio = null; });
    audio.addEventListener('error', () => _stopRecAudio());
  });
}

function _fcPlayCurrent(){
  const file=(document.getElementById('fc-qari')||{}).value||'';
  if(!file || fc.cards.length===0){ renderFC(); _playerFcUpdateUI(); return; }

  // Cari kartu pertama yang memiliki ayat valid sebagai anchor audio
  // Kumpulkan semua kartu yang berasal dari ayat yang sama sebagai "sesi" sekuensial
  // Strategi: ambil ayat dari kartu idx saat ini, putar audio ayat itu penuh,
  // lalu geser kartu sesuai timing segment masing-masing kata.
  // Jika kartu bukan per-kata (per-ayat), putar ayatnya lalu next kartu.

  const c = fc.cards[fc.idx];
  if(!c || !c.sId || !c.ayatN){ renderFC(); _playerFcUpdateUI(); return; }

  const key = c.sId + ':' + c.ayatN;
  const isKata = !!c.wIdx;

  _fcStopAudio();

  _loadRecitationData(file, function(data){
    const entry = data[key];

    if(!entry || !entry.audio_url){
      // Tidak ada data audio → langsung auto-next
      renderFC(); _playerFcUpdateUI();
      if(_playerFcAuto) setTimeout(_fcAutoNext, 400);
      return;
    }

    const segments = entry.segments || [];

    if(!isKata){
      // ── Mode per-ayat: putar penuh lalu pindah kartu ──
      const audio = new Audio(entry.audio_url);
      _fcAudio = audio;
      audio.addEventListener('loadedmetadata',()=>{
        audio.currentTime=0;
        audio.play().catch(()=>{ _fcAudio=null; renderFC(); _playerFcUpdateUI(); });
        renderFC(); _playerFcUpdateUI();
      });
      audio.addEventListener('ended',()=>{
        _fcAudio=null; renderFC(); _playerFcUpdateUI();
        if(_playerFcAuto) setTimeout(_fcAutoNext, 400);
      });
      audio.addEventListener('error',()=>{ _fcAudio=null; renderFC(); _playerFcUpdateUI(); });
      return;
    }

    // ── Mode per-kata: audio per ayat, kartu geser per segment ──
    // Bangun map: wIdx → kartu index dalam fc.cards yang relevan dengan ayat ini
    // dimulai dari fc.idx saat ini
    // Kumpulkan semua kartu berurutan dari idx ini yang punya ayat sama
    const sameSId = c.sId, sameAyat = c.ayatN;
    const cardSlice = []; // {fcIdx, wIdx}
    for(let i = fc.idx; i < fc.cards.length; i++){
      const ci = fc.cards[i];
      if(ci.sId === sameSId && ci.ayatN === sameAyat && ci.wIdx){
        cardSlice.push({fcIdx: i, wIdx: ci.wIdx});
      } else {
        break; // berhenti jika ayat sudah beda
      }
    }
    if(cardSlice.length === 0){ renderFC(); _playerFcUpdateUI(); return; }

    // Bangun timeline: tiap entry cardSlice punya startMs (dari segment)
    // Jika segment tidak ada untuk wIdx → pakai waktu setelah segment sebelumnya berakhir
    const timeline = [];
    let lastEndMs = 0;
    for(let ci of cardSlice){
      const seg = segments.find(s=>s[0]===ci.wIdx);
      if(seg){
        timeline.push({fcIdx: ci.fcIdx, startMs: seg[1], endMs: seg[2]});
        lastEndMs = seg[2];
      } else {
        // Tidak ada segment → tampilkan langsung setelah entry sebelumnya berakhir
        timeline.push({fcIdx: ci.fcIdx, startMs: lastEndMs, endMs: lastEndMs});
      }
    }

    const audio = new Audio(entry.audio_url);
    _fcAudio = audio;
    let timelineIdx = 0;
    let _fcCheckTimer = null;

    function advanceToCard(tlIdx){
      if(tlIdx >= timeline.length) return;
      const entry2 = timeline[tlIdx];
      fc.idx = entry2.fcIdx;
      renderFC();
      _playerFcUpdateUI();
    }

    audio.addEventListener('loadedmetadata',()=>{
      audio.currentTime = timeline[0].startMs / 1000;
      audio.play().catch(()=>{ _fcAudio=null; renderFC(); _playerFcUpdateUI(); });
      // Set kartu pertama
      advanceToCard(0);
      renderFC(); _playerFcUpdateUI();
    });

    audio.addEventListener('timeupdate',()=>{
      const nowMs = audio.currentTime * 1000;
      // Cek apakah sudah waktunya pindah ke kartu berikutnya
      while(timelineIdx + 1 < timeline.length){
        const nextEntry = timeline[timelineIdx + 1];
        // Pindah saat waktu audio sudah melewati startMs kartu berikutnya,
        // ATAU jika endMs kartu saat ini sudah terlewat dan startMs berikutnya belum tiba
        const curEnd = timeline[timelineIdx].endMs;
        const nextStart = nextEntry.startMs;
        const shouldAdvance = nowMs >= nextStart ||
          (curEnd > 0 && nowMs >= curEnd && nowMs < nextStart);
        if(shouldAdvance){
          timelineIdx++;
          advanceToCard(timelineIdx);
        } else {
          break;
        }
      }
    });

    audio.addEventListener('ended',()=>{
      _fcAudio=null;
      // Pastikan kartu terakhir dalam slice sudah aktif
      if(timeline.length > 0){
        fc.idx = timeline[timeline.length-1].fcIdx;
      }
      renderFC(); _playerFcUpdateUI();
      if(_playerFcAuto) setTimeout(_fcAutoNext, 400);
    });

    audio.addEventListener('error',()=>{ _fcAudio=null; renderFC(); _playerFcUpdateUI(); });
  });
}

    const isAr = !fc.showTr;
    inner = `<div class="${isAr?'fc-ar':'fc-tr-big'}" style="${isAr?'':'font-size:clamp(42px,8vw,90px);color:var(--c-text)'}">${main}</div>
             <div class="fc-hint">Tap untuk lihat jawaban</div>`;
  } else {
    if(!fc.showTr){
      inner = `<div class="fc-ar-sm" style="font-size:clamp(20px,3.5vw,36px);direction:rtl;font-family:'Conv_original-hafs';color:var(--c-muted)">${c.ar}</div>
               <div class="fc-tr-big" style="font-size:clamp(28px,5vw,54px);color:var(--c-green);font-weight:600;margin-top:12px">${c.tr}</div>
               <div class="fc-surah">${c.ref}</div>`;
    } else {
      inner = `<div style="font-family:'Conv_original-hafs';font-size:clamp(48px,9vw,96px);direction:rtl;color:var(--c-green)">${c.ar}</div>
               <div style="font-size:clamp(13px,2vw,18px);direction:ltr;color:var(--c-muted);margin-top:10px">${c.tr}</div>
               <div class="fc-surah">${c.ref}</div>`;
    }
  }
  cardEl.innerHTML = inner;
}

function fcFsFlip(){
  fc.flipped = !fc.flipped;
  fcFsRender();
  renderFC(); // sync kartu utama juga
}

function fcFsNext(){
  _fcStopAudio();
  fc.idx = (fc.idx + 1) % fc.cards.length;
  fc.flipped = false;
  fcFsRender();
  renderFC();
  _playerFcUpdateUI();
}

function fcFsPrev(){
  _fcStopAudio();
  fc.idx = (fc.idx - 1 + fc.cards.length) % fc.cards.length;
  fc.flipped = false;
  fcFsRender();
  renderFC();
  _playerFcUpdateUI();
}

// Tutup fullscreen jika menekan Escape
document.addEventListener('keydown', function(e){
  if(e.key==='Escape') fcCloseFullscreen();
});

// Sync fullscreen saat kartu berpindah dari luar
const _origRenderFC = renderFC;
renderFC = function(){
  _origRenderFC();
  const overlay = document.getElementById('fc-fullscreen-overlay');
  if(overlay && overlay.classList.contains('active')) fcFsRender();
};
// ───────────────────────────────────────────────────────────────────────────
let _playerAyat  = 0;    // ayat number aktif
let _playerAuto  = false;
let _playerPlaying = false;

function _playerGetAyatList(){
  const sId = _playerSurah;
  const s = DATA[sId];
  if(!s) return [];
  const fr = +document.getElementById('ayat-from').value || 1;
  const to = +document.getElementById('ayat-to').value  || s.jml;
  return s.ayat.filter(a=>a.n>=fr && a.n<=to).map(a=>a.n);
}

function _playerUpdateUI(){
  const bar = document.getElementById('player-bar');
  const s = DATA[_playerSurah];
  if(!s || !_playerSurah){ bar.style.display='none'; return; }
  bar.style.display='flex';
  document.getElementById('player-surah-name').textContent = s.name;
  document.getElementById('player-ayat-label').textContent = 'Ayat ' + _playerAyat;
  // play/pause icon
  const playBtn = document.getElementById('player-play');
  playBtn.innerHTML = _playerPlaying ? '&#9646;&#9646;' : '&#9654;';
  playBtn.classList.toggle('playing', _playerPlaying);
  // auto btn
  document.getElementById('player-auto').classList.toggle('on', _playerAuto);
  // prev/next disabled state
  const list = _playerGetAyatList();
  const idx = list.indexOf(_playerAyat);
  document.getElementById('player-prev').disabled = idx <= 0;
  document.getElementById('player-next').disabled = idx < 0 || idx >= list.length - 1;
}

function _playerScrollToAyat(){
  // Scroll ayat yang sedang diputar ke tengah layar
  const ayats = document.querySelectorAll('.ayat-block');
  const list = _playerGetAyatList();
  const idx = list.indexOf(_playerAyat);
  if(ayats[idx]){
    ayats[idx].scrollIntoView({behavior:'smooth', block:'center'});
  }
}

function _playerPlayCurrent(){
  _stopRecAudio();
  _playerPlaying = false;
  _playerUpdateUI();

  const file = _currentQariFile();
  if(!file){ _playerPlaying = false; _playerUpdateUI(); return; }

  const sId = _playerSurah;
  const ayatN = _playerAyat;
  const key = sId + ':' + ayatN;

  // Highlight nomor ayat di kata-grid
  const numEl = document.querySelector(`.kata-item-num[data-sidx="${sId}"][data-ayat="${ayatN}"]`);

  _loadRecitationData(file, function(data){
    const entry = data[key];
    if(!entry || !entry.segments || !entry.segments.length){
      // Tidak ada data audio untuk ayat ini, skip ke berikutnya jika auto
      _playerPlaying = false;
      _playerUpdateUI();
      if(_playerAuto) setTimeout(playerNext, 800);
      return;
    }

    const segments = entry.segments;
    let kataItems = [];
    if(numEl){
      const grid = numEl.parentElement;
      kataItems = Array.from(grid.querySelectorAll('.kata-item:not(.kata-item-num)'));
      _recActiveEl = numEl;
      numEl.classList.add('tts-active');
    }

    const audio = new Audio(entry.audio_url);
    _recAudio = audio;
    _playerPlaying = true;
    _playerUpdateUI();
    let activeSegIdx = -1;

    audio.addEventListener('loadedmetadata', ()=>{
      audio.currentTime = 0;
      audio.play().catch(()=>{ _playerPlaying=false; _playerUpdateUI(); });
    });

    audio.addEventListener('timeupdate', ()=>{
      const nowMs = audio.currentTime * 1000;
      let newSeg = -1;
      for(let i=0;i<segments.length;i++){
        if(nowMs>=segments[i][1] && nowMs<segments[i][2]){newSeg=i;break;}
      }
      if(newSeg !== activeSegIdx){
        activeSegIdx = newSeg;
        kataItems.forEach(el=>el.classList.remove('tts-active'));
        if(newSeg>=0){
          const wi = segments[newSeg][0]-1;
          if(kataItems[wi]) kataItems[wi].classList.add('tts-active');
        }
      }
    });

    audio.addEventListener('ended', ()=>{
      _clearRecActive();
      _recAudio = null;
      _playerPlaying = false;
      _playerUpdateUI();
      if(_playerAuto) setTimeout(playerNext, 600);
    });

    audio.addEventListener('error', ()=>{
      _playerPlaying = false;
      _playerUpdateUI();
      _stopRecAudio();
    });
  });
}

// Dipanggil dari playAyatAudio agar player bar sinkron
function _playerSyncFrom(sId, ayatN){
  _playerSurah = sId;
  _playerAyat  = ayatN;
  _playerPlaying = true;
  _playerUpdateUI();
}

function playerPlayPause(){
  if(_playerPlaying){
    _stopRecAudio();
    _playerPlaying = false;
    _playerUpdateUI();
  } else {
    if(!_playerSurah){
      // Ambil dari setting baca saat ini
      _playerSurah = +document.getElementById('sel-surah').value;
      const list = _playerGetAyatList();
      _playerAyat = list[0] || 1;
    }
    _playerScrollToAyat();
    _playerPlayCurrent();
  }
}

function playerPrev(){
  const list = _playerGetAyatList();
  const idx = list.indexOf(_playerAyat);
  if(idx > 0){
    _playerAyat = list[idx-1];
    _playerScrollToAyat();
    _playerPlayCurrent();
  }
}

function playerNext(){
  const list = _playerGetAyatList();
  const idx = list.indexOf(_playerAyat);
  if(idx >= 0 && idx < list.length-1){
    _playerAyat = list[idx+1];
    _playerScrollToAyat();
    _playerPlayCurrent();
  } else {
    _playerPlaying = false;
    _playerAuto = false;
    _playerUpdateUI();
  }
}

function playerToggleAuto(){
  _playerAuto = !_playerAuto;
  _playerUpdateUI();
}

// Patch playAyatAudio agar sinkron dengan player bar
const _origPlayAyatAudio = playAyatAudio;
playAyatAudio = function(numEl){
  _playerSurah = +numEl.dataset.sidx;
  _playerAyat  = +numEl.dataset.ayat;
  _origPlayAyatAudio(numEl);
  // Sinkron state setelah audio dimulai
  setTimeout(()=>{
    _playerPlaying = !!_recAudio;
    _playerUpdateUI();
  }, 200);
};

// Tampilkan player bar saat tab baca aktif dan ada qari dipilih
function _playerCheckShow(){
  const bar = document.getElementById('player-bar');
  const fcUI = document.getElementById('player-fc-ui');
  const bacaUI = document.getElementById('player-baca-ui');

  if(activeTab === 'flashcard'){
    // Serahkan ke _playerFcUpdateUI
    bacaUI.style.display='none';
    _playerFcUpdateUI();
    return;
  }

  // Mode Baca
  fcUI.style.display='none';
  bacaUI.style.display='flex';

  const file = _currentQariFile();
  if(!file){ bar.style.display='none'; return; }
  if(!_playerSurah){
    _playerSurah = +document.getElementById('sel-surah').value;
    const list = _playerGetAyatList();
    _playerAyat = list[0] || 1;
  }
  _playerUpdateUI();
}

// Jalankan cek ketika qari berubah atau tab berubah
const _origOnQariChange = onQariChange;
onQariChange = function(){
  _origOnQariChange();
  setTimeout(_playerCheckShow, 100);
};

// Patch renderBaca agar player bar update posisi ayat
const _origRenderBaca = renderBaca;
renderBaca = function(){
  _origRenderBaca();
  _playerSurah = +document.getElementById('sel-surah').value;
  const list = _playerGetAyatList();
  if(!list.includes(_playerAyat)) _playerAyat = list[0] || 1;
  _playerCheckShow();
};

// Tampilkan player bar setelah init
setTimeout(_playerCheckShow, 1600);
// ───────────────────────────────────────────────────────────────────────────

// ────────────────────────────────────────────────────────────────────────────
</script>
