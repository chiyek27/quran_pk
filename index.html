<html>
<!-- https://surahquran.com/ -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<link href="/css/arab.css" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600&amp;family=Scheherazade+New:wght@400&amp;display=swap" rel="stylesheet"/>

<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:var(--font-sans,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif);font-size:16px}
:root{
  --c-gold:#B8860B;--c-gold-light:#FFF8E1;--c-gold-border:#E8C84A;
  --c-green:#0F6E56;--c-green-light:#E1F5EE;
  --c-text:var(--color-text-primary,#1a1a1a);
  --c-muted:var(--color-text-secondary,#666);
  --c-bg:var(--color-background-primary,#fff);
  --c-surface:var(--color-background-secondary,#f8f8f8);
  --c-border:var(--color-border-tertiary,#e0e0e0);
  --radius:12px;--radius-sm:8px;
}

/* ── Layout ── */
.app{min-height:100dvh;padding:0 0 90px;max-width:480px;margin:0 auto}

/* ── Header ── */
.header{
  padding:16px 16px 12px;
  display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid var(--c-border);
}
.header-title{font-size:16px;font-weight:600;color:var(--c-text)}
.header-sub{font-size:12px;color:var(--c-muted);margin-top:2px}
.header-icon{
  width:36px;height:36px;border-radius:50%;
  background:var(--c-green-light);
  display:flex;align-items:center;justify-content:center;
  color:var(--c-green);font-size:18px;flex-shrink:0;
}

/* ── Tabs ── */
.tabs{
  display:grid;grid-template-columns:repeat(3,1fr);
  border-bottom:1px solid var(--c-border);
  background:var(--c-bg);
  position:sticky;top:0;z-index:10;
}
.tab{
  padding:12px 0;font-size:13px;font-weight:500;
  color:var(--c-muted);cursor:pointer;text-align:center;
  border-bottom:2px solid transparent;
  transition:color .18s,border-color .18s;
  display:flex;align-items:center;justify-content:center;gap:4px;
}
.tab.active{color:var(--c-green);border-bottom-color:var(--c-green)}
.tab-chevron{
  font-size:10px;line-height:1;
  display:none;transition:transform .2s;
}
.tab.active .tab-chevron{display:inline-block}
.tab-chevron.open{transform:rotate(180deg)}

/* ── Content ── */
.content{padding:14px 14px 0}

/* ── Settings card ── */
.settings-card{
  background:var(--c-surface);
  border:1px solid var(--c-border);
  border-radius:var(--radius);
  overflow:hidden;
  margin-bottom:14px;
}
.tab-settings-btn{
  padding:12px 14px;font-size:16px;
  color:var(--c-muted);cursor:pointer;
  border-bottom:2px solid transparent;
  transition:color .18s;
  display:flex;align-items:center;
}
.tab-settings-btn.active{color:var(--c-green)}
  display:flex;align-items:center;justify-content:space-between;
  padding:11px 14px;
  background:var(--c-green);
  color:#fff;cursor:pointer;
  border-radius:var(--radius);
  margin-bottom:10px;
  user-select:none;
  -webkit-tap-highlight-color:transparent;
}
.settings-summary-info{display:flex;flex-direction:column;gap:2px}
.settings-summary-title{font-size:14px;font-weight:600;line-height:1.3}
.settings-summary-sub{font-size:12px;opacity:.82}
.settings-summary-icon{font-size:18px;transition:transform .2s}
.settings-summary-icon.open{transform:rotate(180deg)}
.settings-body{display:none}
.settings-body.open{display:block}
.settings-row{
  display:flex;align-items:center;justify-content:space-between;
  padding:13px 14px;
  border-bottom:1px solid var(--c-border);
  gap:12px;
}
.settings-row:last-child{border-bottom:none}
.settings-row label{font-size:14px;color:var(--c-text);flex-shrink:0}
.settings-row select,
.settings-row input[type=number]{
  font-size:14px;padding:7px 10px;
  border-radius:var(--radius-sm);
  border:1px solid var(--c-border);
  background:var(--c-bg);color:var(--c-text);
  min-width:0;flex:1;max-width:180px;
}
.ayat-range{display:flex;gap:8px;align-items:center;flex:1;justify-content:flex-end}
.ayat-range select{width:70px;text-align:center;flex:none;padding:7px 4px;font-size:14px;border-radius:var(--radius-sm);border:1px solid var(--c-border);background:var(--c-bg);color:var(--c-text)}
.ayat-sep{font-size:12px;color:var(--c-muted);white-space:nowrap}
.toggle-group{display:flex;gap:4px}
.tgl{
  font-size:13px;padding:7px 14px;
  border-radius:20px;border:1px solid var(--c-border);
  cursor:pointer;color:var(--c-muted);background:var(--c-bg);
  font-weight:500;transition:all .15s;
}
.tgl.on{background:var(--c-green);color:#fff;border-color:var(--c-green)}
.apply-btn{
  display:block;width:calc(100% - 28px);margin:0 14px 14px;
  padding:13px;background:var(--c-green);color:#fff;
  border:none;border-radius:var(--radius-sm);
  font-size:15px;font-weight:600;cursor:pointer;
  letter-spacing:.01em;
}
.apply-btn:active{opacity:.82;transform:scale(.98)}

/* ── Surah header ── */
.surah-header{
  text-align:center;padding:20px 16px;
  background:linear-gradient(145deg,#0F6E56,#1a9970);
  border-radius:var(--radius);margin-bottom:14px;color:#fff;
}
.surah-name-ar{font-size:30px;font-family:"Conv_original-hafs";margin-bottom:6px;line-height:1.4}
.surah-name-id{font-size:13px;opacity:.85;letter-spacing:.02em}
.bismillah{
  text-align:center;font-size:24px;font-family:"Conv_original-hafs";
  color:var(--c-gold);padding:14px 0 10px;direction:rtl;line-height:1.7;
}

/* ── Per-ayat ── */
.ayat-block{
  border-top:1px solid var(--c-border);
  padding:14px 0;
  transition:background .2s,border-color .2s;
}
.ayat-block:last-child{
  border-bottom:1px solid var(--c-border);
}
.kata-item.tts-active{
  background:var(--c-green-light);
  border-color:var(--c-green);
}
.ayat-tr-text.tts-active{
  background:var(--c-green-light);
  border-radius:4px;
  padding:2px 4px;
  color:var(--c-text);
}
.ayat-ar{
  direction:rtl;
  font-family:"Conv_original-hafs";
  font-size:28px;
}
.ayat-num{
  display:inline;
  font-family:'Conv_original-hafs';font-size:1em;
  color:var(--c-gold);margin-right:4px;
}
.ayat-tr{
  padding:12px 0px;font-size:14px;
  color:var(--c-muted);line-height:1.5;background:var(--c-bg);
}
.ayat-tr-text{cursor:pointer;}

/* ── Per-kata ── */
.kata-ayat{margin-bottom:16px}
.kata-ayat-num{
  font-size:12px;color:var(--c-muted);
  margin-bottom:10px;padding-bottom:8px;
  border-bottom:1px solid var(--c-border);
  font-weight:500;
}
.kata-grid{display:flex;gap:8px;direction:rtl;justify-content:flex-start;flex-wrap:wrap}
.kata-item{
  background:var(--c-surface);
  border:1px solid var(--c-border);
  border-radius:var(--radius-sm);
  padding:10px 12px;text-align:center;
  cursor:pointer;min-width:64px;
  transition:background .12s,border-color .12s,transform .1s;
}
.kata-item:active{
  background:var(--c-green-light);border-color:var(--c-green);
  transform:scale(.95);
}
.kata-ar{font-family:"Conv_original-hafs";font-size:26px;color:var(--c-text);direction:rtl;line-height:1.5}
.kata-tr{font-size:11px;color:var(--c-muted);margin-top:4px;direction:ltr;line-height:1.3}
.kata-item-num{min-width:48px;cursor:default}

/* ── Flashcard ── */
.fc-wrap{padding:4px 0}
.fc-mode-row{display:flex;gap:6px;margin-bottom:12px}
.fc-mode-btn{
  flex:1;padding:10px 6px;font-size:13px;font-weight:500;
  border:1px solid var(--c-border);border-radius:var(--radius-sm);
  background:var(--c-bg);cursor:pointer;color:var(--c-muted);
  transition:all .15s;
}
.fc-mode-btn.on{background:var(--c-green);color:#fff;border-color:var(--c-green)}
.fc-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.fc-nav span{font-size:14px;color:var(--c-muted);font-weight:500}
.fc-btn{
  width:42px;height:42px;border-radius:50%;
  border:1px solid var(--c-border);background:var(--c-surface);
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  color:var(--c-text);font-size:18px;transition:background .12s;
}
.fc-btn:active{background:var(--c-green-light)}
.fc-btn:disabled{opacity:.3;pointer-events:none}
.flashcard{
  background:var(--c-bg);border:1px solid var(--c-border);
  border-radius:var(--radius);min-height:200px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:28px 20px;cursor:pointer;
  box-shadow:0 2px 8px rgba(0,0,0,.06);
  transition:transform .08s;user-select:none;
}
.flashcard:active{transform:scale(.98)}
.fc-front,.fc-back{text-align:center;width:100%}
.fc-ar{font-family:"Conv_original-hafs";font-size:42px;color:var(--c-text);direction:rtl;line-height:1.5}
.fc-hint{font-size:12px;color:var(--c-muted);margin-top:14px;letter-spacing:.02em}
.fc-tr-big{font-size:20px;font-weight:600;color:var(--c-green);margin-bottom:8px;line-height:1.4}
.fc-ar-sm{font-family:"Conv_original-hafs";font-size:26px;color:var(--c-muted);direction:rtl}
.fc-surah{font-size:12px;color:var(--c-muted);margin-top:10px}
.swipe-hint{font-size:11px;color:var(--c-muted);text-align:center;margin-top:10px;opacity:.7}
.fc-progress{display:flex;gap:4px;flex-wrap:wrap;margin-top:14px;justify-content:center}
.fc-dot{width:8px;height:8px;border-radius:50%;border:1px solid var(--c-border);background:transparent}
.fc-dot.done{background:var(--c-green);border-color:var(--c-green)}
.fc-dot.cur{background:var(--c-gold);border-color:var(--c-gold)}
.fc-actions{display:flex;gap:10px;margin-top:14px}
.fc-actions button{
  flex:1;padding:13px 8px;border-radius:var(--radius-sm);
  font-size:14px;font-weight:500;cursor:pointer;
  transition:opacity .15s;
}
.fc-actions button:active{opacity:.8}
.fc-act-repeat{border:1px solid var(--c-border);background:var(--c-surface);color:var(--c-muted)}
.fc-act-know{border:none;background:var(--c-green);color:#fff}

/* ── Latihan result / progress ── */
.lat-progress-bar{height:5px;background:var(--c-border);border-radius:3px;margin-bottom:14px;overflow:hidden}
.lat-progress-fill{height:100%;background:var(--c-green);border-radius:3px;transition:width .3s}
.lat-question-card{
  background:var(--c-surface);border:1px solid var(--c-border);
  border-radius:var(--radius);text-align:center;
  padding:24px 16px;margin-bottom:14px;
}
.lat-choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lat-choice-btn{
  padding:14px 8px;
  border:1px solid var(--c-border);border-radius:var(--radius-sm);
  background:var(--c-bg);color:var(--c-text);
  cursor:pointer;font-size:13px;min-height:60px;
  line-height:1.4;transition:background .12s,border-color .12s;
}
.lat-choice-btn:active{background:var(--c-green-light)}

.badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:10px;background:var(--c-green-light);color:var(--c-green);margin:2px}

/* ── Catatan Kaki ── */
.fn-block{
  margin-top:8px;border-top:1px dashed var(--c-border);
  padding-top:8px;
}
.fn-toggle{
  display:flex;align-items:center;gap:6px;
  font-size:12px;color:var(--c-gold);font-weight:500;
  cursor:pointer;user-select:none;padding:2px 0;
}
.fn-toggle-icon{font-size:10px;transition:transform .2s;display:inline-block}
.fn-toggle.open .fn-toggle-icon{transform:rotate(180deg)}
.fn-text{
  display:none;margin-top:6px;font-size:12px;
  color:var(--c-muted);line-height:1.6;
  white-space:pre-line;
}
.fn-text.tts-active{
  background:var(--c-green-light);
  border-radius:4px;
  padding:4px 6px;
  color:var(--c-text);
}
.fn-part{
  cursor:pointer;padding:3px 0;
}
.fn-part+.fn-part{margin-top:4px}
.fn-part.tts-active{
  background:var(--c-green-light);
  border-radius:4px;
  padding:3px 6px;
  margin:0 -6px;
  color:var(--c-text);
}
.fn-text.open{display:block}

/* ── Tafsir ── */
.tafsir-block{
  margin-top:8px;border-top:1px dashed var(--c-border);
  padding-top:8px;
}
.tafsir-toggle{
  display:flex;align-items:center;gap:6px;
  font-size:12px;font-weight:500;
  cursor:pointer;user-select:none;padding:2px 0;
}
.tafsir-toggle.ar{color:#7a5a00}
.tafsir-toggle.id{color:var(--c-green)}
.tafsir-toggle-icon{font-size:10px;transition:transform .2s;display:inline-block}
.tafsir-toggle.open .tafsir-toggle-icon{transform:rotate(180deg)}
.tafsir-text{
  display:none;margin-top:6px;font-size:13px;
  line-height:1.75;white-space:pre-line;
}
.tafsir-text.ar{
  direction:rtl;font-family:"Conv_original-hafs";font-size:22px;
  color:var(--c-text);line-height:2;
}
.tafsir-text.id{color:var(--c-muted)}
.tafsir-text.open{display:block}

/* ── Settings: tafsir section divider ── */
.settings-section-label{
  padding:7px 14px 5px;
  font-size:11px;font-weight:600;
  color:var(--c-muted);
  letter-spacing:.06em;text-transform:uppercase;
  border-bottom:1px solid var(--c-border);
  background:var(--c-surface);
}
.tafsir-ar-span{
  cursor:pointer;display:inline;
}
.tafsir-ar-span.tts-active{
  background:var(--c-green-light);
  border-radius:4px;
  padding:2px 4px;
  color:var(--c-text);
}
.tafsir-ar-word{
  display:inline;border-radius:3px;
  transition:background .1s;
}
.tafsir-ar-word.tts-word-active{
  background:var(--c-gold-light);
  outline:1px solid var(--c-gold-border);
  border-radius:3px;
  color:var(--c-text);
}
.tafsir-text.id.tts-active{
  background:var(--c-green-light);
  border-radius:4px;
  padding:2px 4px;
  color:var(--c-text);
}
.tts-id-word{
  display:inline;border-radius:3px;
  transition:background .1s;
}
.tts-id-word.tts-word-active{
  background:var(--c-gold-light);
  outline:1px solid var(--c-gold-border);
  border-radius:3px;
  color:var(--c-text);
}
  font-size:10px;padding:2px 7px;border-radius:10px;
  font-weight:600;flex-shrink:0;display:inline-block;
}
.badge-ar{background:#FFF8E1;color:#7a5a00;border:1px solid #e8c84a}
.badge-id{background:var(--c-green-light);color:var(--c-green);border:1px solid #9FE1CB}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet">

<h2 class="sr-only" style="position:absolute;left:-9999px">Aplikasi Al-Qur'an per kata — Surat 100 sampai 114</h2>
<div class="app" id="app">
  <div class="header">
    <div>
      <div class="header-title">Al-Qur'an Per Kata</div>
      <div class="header-sub">Surat 1–114 · Baca &amp; Latihan</div>
    </div>
    <div class="header-icon">📖</div>
  </div>
  <div class="tabs">
    <div class="tab active" id="tab-baca" onclick="switchTab('baca')">Baca <span class="tab-chevron" id="chv-baca">▲</span></div>
    <div class="tab" id="tab-latihan" onclick="switchTab('latihan')">Latihan <span class="tab-chevron" id="chv-latihan">▲</span></div>
    <div class="tab" id="tab-flashcard" onclick="switchTab('flashcard')">Flashcard <span class="tab-chevron" id="chv-flashcard">▲</span></div>
  </div>
  <div class="content" id="content-baca">
    <div id="baca-settings-body" class="settings-body">
    <div id="baca-settings" class="settings-card">
      <div class="settings-row">
        <label>Surat</label>
        <select id="sel-surah" onchange="updateAyatRange();renderBaca()"></select>
      </div>
      <div class="settings-row">
        <label>Ayat</label>
        <div class="ayat-range">
          <select id="ayat-from" onchange="renderBaca()"></select>
          <span class="ayat-sep">s/d</span>
          <select id="ayat-to" onchange="renderBaca()"></select>
        </div>
      </div>
      <div class="settings-row">
        <label>Tampilan</label>
        <div class="toggle-group">
          <div class="tgl on" id="tgl-ayat" onclick="toggleMode('ayat')">Per ayat</div>
          <div class="tgl on" id="tgl-kata" onclick="toggleMode('kata')">Per kata</div>
        </div>
      </div>
      <div class="settings-row">
        <label>Terjemahan</label>
        <div class="toggle-group">
          <div class="tgl on" id="tgl-tr-ayat" onclick="toggleTr('ayat')">Per ayat</div>
          <div class="tgl on" id="tgl-tr-kata" onclick="toggleTr('kata')">Per kata</div>
        </div>
      </div>
      <div class="settings-row">
        <label>Catatan kaki</label>
        <div class="toggle-group">
          <div class="tgl on" id="tgl-fn" onclick="toggleFn()">Tampilkan</div>
        </div>
      </div>

      <div class="settings-section-label">Tafsir</div>

      <div class="settings-row">
        <label><span class="lang-badge badge-ar">AR</span>&nbsp;Tafsir Arab</label>
        <select id="sel-tafsir-ar" onchange="onTafsirChange('ar')" style="max-width:160px">
          <option value="">— Tidak tampilkan —</option>
          <option value="ar-tafsir-as-saadi.json">As-Sa'di</option>
          <option value="ar-tafsir-jalalayn.json">Al-Jalalayn</option>
          <option value="ar-tafsir-mukhtasar.json">Mukhtasar</option>
        </select>
      </div>
      <div class="settings-row">
        <label><span class="lang-badge badge-id">ID</span>&nbsp;Tafsir Indonesia</label>
        <select id="sel-tafsir-id" onchange="onTafsirChange('id')" style="max-width:160px">
          <option value="">— Tidak tampilkan —</option>
          <option value="id-tafsir-as-saadi.json">As-Sa'di</option>
          <option value="id-tafsir-jalalayn.json">Al-Jalalayn</option>
          <option value="id-tafsir-mukhtasar.json">Mukhtasar</option>
        </select>
      </div>

    </div>
    </div><!-- /baca-settings-body -->
    <div id="baca-output"></div>
  </div>
  <div class="content" id="content-latihan" style="display:none">
    <div id="lat-settings-body" class="settings-body open">
    <div class="settings-card">
      <div class="settings-row">
        <label>Sumber soal</label>
        <select id="lat-scope" onchange="toggleLatScope()">
          <option value="ayat">Surat dipilih</option>
          <option value="random-all">Semua surat</option>
        </select>
      </div>
      <div class="settings-row">
        <label>Level latihan</label>
        <select id="lat-level" onchange="toggleLatLevel()">
          <option value="ayat">Per ayat</option>
          <option value="kata" selected>Per kata</option>
        </select>
      </div>
      <div class="settings-row" id="lat-surah-row">
        <label>Surat</label>
        <select id="lat-surah" onchange="updateLatRange()"></select>
      </div>
      <div class="settings-row" id="lat-ayat-row">
        <label>Ayat</label>
        <div class="ayat-range">
          <select id="lat-from" onchange="updateLatJumlah()"></select>
          <span class="ayat-sep">s/d</span>
          <select id="lat-to" onchange="updateLatJumlah()"></select>
        </div>
      </div>
      <div class="settings-row">
        <label>Jumlah soal</label>
        <input type="number" id="lat-jumlah" min="1" max="9999" style="max-width:80px;text-align:center">
      </div>
      <div class="settings-row">
        <label>Mode latihan</label>
        <select id="lat-mode">
          <option value="ar2tr">Arab → Terjemahan</option>
          <option value="tr2ar">Terjemahan → Arab</option>
        </select>
      </div>
      <div class="settings-row" id="lat-order-row">
        <label>Urutan soal</label>
        <div class="toggle-group">
          <div class="tgl on" id="tgl-lat-urut" onclick="toggleLatOrder('urut')">Urut</div>
          <div class="tgl" id="tgl-lat-acak" onclick="toggleLatOrder('acak')">🔀 Acak</div>
        </div>
      </div>
      <button class="apply-btn" onclick="startLatihan();closeSettings('lat')">Mulai Latihan</button>
    </div>
    </div><!-- /lat-settings-body -->
    <div id="latihan-output"></div>
  </div>
  <div class="content" id="content-flashcard" style="display:none">
    <div id="fc-settings-body" class="settings-body open">
    <div class="settings-card">
      <div class="settings-row">

function updateLatJumlah(){
  const scope=document.getElementById('lat-scope').value;
  const level=document.getElementById('lat-level').value;
  let count=0;
  if(scope==='random-all'){
    for(let sId=1;sId<=114;sId++){
      const s=DATA[sId];
      if(!s) continue;
      if(level==='kata' && typeof KATA_DATA!=='undefined' && KATA_DATA[sId]){
        Object.values(KATA_DATA[sId]).forEach(words=>{ count+=words.filter(w=>w.tr).length; });
      } else {
        count+=s.jml;
      }
    }
  } else {
    const sId=+document.getElementById('lat-surah').value;
    const s=DATA[sId];
    if(!s) return;
    const fr=+document.getElementById('lat-from').value||1;
    const to=+document.getElementById('lat-to').value||s.jml;
    const filtered=s.ayat.filter(a=>a.n>=fr&&a.n<=to);
    if(level==='kata' && typeof KATA_DATA!=='undefined' && KATA_DATA[sId]){
      filtered.forEach(a=>{
        const words=KATA_DATA[sId][a.n];
        if(words) count+=words.filter(w=>w.tr).length;
      });
    } else {
      count=filtered.length;
    }
  }
  document.getElementById('lat-jumlah').value=count||'';
}

let _ttsVoices=[];

function _pickVoice(lang, priorityKw, femaleKw){
  const list=_ttsVoices.filter(v=>v.lang.startsWith(lang));
  if(priorityKw){
    const hit=list.find(v=>priorityKw.some(k=>v.name.toLowerCase().includes(k)));
    if(hit) return hit;
  }
  const male=list.find(v=>!femaleKw.some(k=>v.name.toLowerCase().includes(k)));
  return male||list[0]||null;
}

function _setActive(elOrNull, cls){
  const c=cls||'tts-active';
  document.querySelectorAll('.'+c).forEach(el=>el.classList.remove(c));
  if(elOrNull) elOrNull.classList.add(c);
}

// Auto-calibration: ukur charsPerSec aktual dari TTS pertama yang selesai.
// Disimpan di localStorage agar tidak perlu kalibrasi ulang setiap buka app.
// Kalibrasi CPS dipisah per bahasa: AR dan ID punya kecepatan berbeda
let _calibratedCPS = { ar: null, id: null };
(function(){
  try {
    const ar = parseFloat(localStorage.getItem('tts_cps_ar'));
    const id = parseFloat(localStorage.getItem('tts_cps_id'));
    if(ar > 0) _calibratedCPS.ar = ar;
    if(id > 0) _calibratedCPS.id = id;
  } catch(e){}
})();

function _startCalibration(utt, textLength, lang){
  // Kalibrasi hanya untuk Android (timer fallback), web pakai onboundary native
  if(!_isAndroid || _calibratedCPS[lang]) return;
  const t0 = Date.now();
  const origOnend = utt.onend;
  utt.onend = function(e){
    const elapsed = (Date.now() - t0) / 1000;
    if(elapsed > 0.3 && textLength > 5){
      _calibratedCPS[lang] = textLength / elapsed;
      try { localStorage.setItem('tts_cps_' + lang, _calibratedCPS[lang]); } catch(ex){}
    }
    if(origOnend) origOnend.call(this, e);
  };
}

// Group wordSpans into punctuation-delimited segments.
// Each segment = array of spans up to (and including) a span whose word ends with punctuation.
function _groupByPunctuation(wordSpans){
  // Returns [{spans, pauseExtra}] where pauseExtra = bonus ms to add AFTER last word of group
  // Heavy pause: titik, tanda tanya, tanda seru, ellipsis → +800ms
  // Light pause : koma, titik dua, titik koma → +350ms
  // No punct    : no extra pause
  const heavyRe = /[.?!؟…]$/;
  const lightRe = /[,;:،؛]$/;
  const anyRe   = /[.,;:?!،؛؟…]$/;
  const groups = [];
  let cur = [];
  wordSpans.forEach(span => {
    cur.push(span);
    const w = (span.dataset.w || span.textContent).trim();
    if(anyRe.test(w)){
      const pauseExtra = heavyRe.test(w) ? 800 : 350;
      groups.push({spans: cur, pauseExtra});
      cur = [];
    }
  });
  if(cur.length) groups.push({spans: cur, pauseExtra: 0});
  return groups;
}

const _isAndroid = /android/i.test(navigator.userAgent);

function _wordHighlighter(wordSpans, utt, cleanText, lang){
  const spanWords = Array.from(wordSpans).map(s => s.dataset.w || s.textContent);

  if(!_isAndroid){
    // ── Web/Desktop: HANYA onboundary native, tidak ada timer sama sekali ──
    utt.onboundary = e => {
      if(e.name !== 'word') return;
      wordSpans.forEach(s => s.classList.remove('tts-word-active'));
      let offset = 0;
      for(let i = 0; i < wordSpans.length; i++){
        const wlen = spanWords[i].length + 1;
        if(e.charIndex >= offset && e.charIndex < offset + wlen){
          wordSpans[i].classList.add('tts-word-active');
          break;
        }
        offset += wlen;
      }
    };
    return () => { wordSpans.forEach(s => s.classList.remove('tts-word-active')); };
  }

  // ── Android: timer fallback (onboundary tidak didukung) ──
  let timerFallback = null;
  let gateTimer = null;

  const rate = utt.rate || 0.9;
  const baseCPS = (_calibratedCPS[lang || 'id'] || (lang === 'ar' ? 1.5 : 2.5));
  const charsPerSec = baseCPS * rate;
  const minWordMs = 100;
  const minSegMs  = 650;

  const groups = _groupByPunctuation(wordSpans);
  const schedule = [];
  groups.forEach(({spans: group, pauseExtra}) => {
    const bases = group.map(s => {
      const w = s.dataset.w || s.textContent;
      return Math.max(minWordMs, Math.round((w.length / charsPerSec) * 1000));
    });
    const segMs = bases.reduce((a, b) => a + b, 0);
    const adjustPerWord = Math.round(Math.max(0, minSegMs - segMs) / group.length);
    bases.forEach((b, i) => {
      const isLast = (i === bases.length - 1);
      schedule.push(Math.max(minWordMs, b + adjustPerWord) + (isLast ? pauseExtra : 0));
    });
  });

  const startFallback = () => {
    let idx = 0;
    const tick = () => {
      if(idx >= wordSpans.length) return;
      wordSpans.forEach(s => s.classList.remove('tts-word-active'));
      wordSpans[idx].classList.add('tts-word-active');
      timerFallback = setTimeout(tick, schedule[idx++] || minWordMs);
    };
    tick();
  };

  // Mulai tick saat onstart fired (suara sudah keluar) + offset 30ms
  utt.onstart = () => {
    if(gateTimer){ clearTimeout(gateTimer); gateTimer = null; }
    gateTimer = setTimeout(startFallback, 0);
  };
  // Safety fallback jika onstart tidak fired
  gateTimer = setTimeout(startFallback, 600);

  return () => {
    if(gateTimer){ clearTimeout(gateTimer); gateTimer = null; }
    if(timerFallback){ clearTimeout(timerFallback); timerFallback = null; }
    wordSpans.forEach(s => s.classList.remove('tts-word-active'));
  };
}

function speakAr(text, blockEl){
  if(!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const utt=new SpeechSynthesisUtterance(text);
  utt.lang='ar-SA';
  utt.rate=1;
  utt.pitch=1;
  const femaleArKw=['female','woman','samira','laila','zira'];
  utt.voice=_pickVoice('ar', null, femaleArKw);

  // Ambil wordSpans dari tafsir-ar-span atau kata-item biasa
  let wordSpans = null;
  if(blockEl){
    if(blockEl.classList.contains('tafsir-ar-span')){
      wordSpans = blockEl.querySelectorAll('.tafsir-ar-word');
    }
    // kata-item (per kata): tidak perlu word highlight karena hanya satu kata
  }

  if(wordSpans && wordSpans.length){
    const cleanup = _wordHighlighter(wordSpans, utt, text, 'ar');
    utt.onend = () => { cleanup(); _setActive(null,'tts-active'); };
    _setActive(blockEl,'tts-active');
  } else {
    utt.onend=()=>_setActive(null,'tts-active');
    if(blockEl) _setActive(blockEl,'tts-active');
  }

  _startCalibration(utt, text.length, 'ar');
  window.speechSynthesis.speak(utt);
}

function speakId(text, blockEl){
  if(!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();

  // Ambil wordSpans dulu, lalu rekonstruksi teks dari span agar offset cocok
  const wordSpans = blockEl && blockEl.querySelectorAll('.tts-id-word');

  let clean;
  if(wordSpans && wordSpans.length){
    // Gunakan teks dari span (sudah di-clean saat render), bukan dari dataset/innerText
    clean = Array.from(wordSpans).map(s => s.dataset.w || s.textContent).join(' ');
  } else {
    clean = text.replace(/^\s*\[\d+\]\.?\s*/,'').replace(/\[\d+\]/g,'').replace(/[()]/g,'').replace(/["\u201C\u201D\u2018\u2019]/g,'').replace(/`/g,"'").trim();
  }

  const utt=new SpeechSynthesisUtterance(clean);
  utt.lang='id-ID';
  utt.rate=1;
  utt.pitch=1;
  const femaleIdKw=['female','woman','siti','wanita'];
  utt.voice=_pickVoice('id', ['ardi'], femaleIdKw);

  if(wordSpans && wordSpans.length){
    const cleanup = _wordHighlighter(wordSpans, utt, clean, 'id');
    utt.onend = () => { cleanup(); _setActive(null,'tts-active'); };
    _setActive(blockEl,'tts-active');
  } else {
    utt.onend=()=>_setActive(null,'tts-active');
    if(blockEl) _setActive(blockEl,'tts-active');
  }

  _startCalibration(utt, clean.length, 'id');
  window.speechSynthesis.speak(utt);
}

function toArabicNum(n){
  return String(n).split('').map(d=>'٠١٢٣٤٥٦٧٨٩'[+d]).join('');
}

// ── Tafsir ──────────────────────────────────────────────
// Cache: {filename: data_object | 'loading' | 'error'}
const tafsirCache = {};

// Active selections
let tafsirArFile = '';
let tafsirIdFile = '';

// Split As-Sa'di grouped tafsir text per ayat
// AR markers: {6}, {8 ـ 9}   ID markers: (6), (8-9)
function splitAssaadi(plainText, ayahKeys, lang) {
  const surahNum = ayahKeys[0].split(':')[0];
  const result = {};
  let parts;
  if (lang === 'ar') {
    // split on {N} or {N ـ M}
    parts = plainText.split(/(?=\{\d[\d\s\u0640\-]*\})/);
  } else {
    // split on (N) or (N-M) — only at word boundary to avoid false matches
    parts = plainText.split(/(?=\(\d[\d\s\-]*\))/);
  }
  parts.forEach(part => {
    part = part.trim();
    if (!part) return;
    let m;
    if (lang === 'ar') {
      m = part.match(/^\{(\d+)(?:[\s\u0640\-]+(\d+))?\}/);
    } else {
      m = part.match(/^\((\d+)(?:[\s\-]+(\d+))?\)/);
    }
    if (!m) return;
    const n1 = parseInt(m[1]), n2 = parseInt(m[2] || m[1]);
    for (let n = n1; n <= n2; n++) {
      const k = surahNum + ':' + n;
      if (ayahKeys.includes(k)) result[k] = part;
    }
  });
  return result;
}

function onTafsirChange(lang) {
  const file = document.getElementById('sel-tafsir-' + lang).value;
  if (lang === 'ar') tafsirArFile = file;
  else tafsirIdFile = file;

  if (file && !tafsirCache[file]) {
    tafsirCache[file] = 'loading';
    fetch(file)
      .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(data => { tafsirCache[file] = data; renderBaca(); })
      .catch(() => { tafsirCache[file] = 'error'; renderBaca(); });
  }
  renderBaca();
}

function toggleTafsirItem(id, lang) {
  const el = document.getElementById('tafsir-text-' + lang + '-' + id);
  const tog = document.getElementById('tafsir-tog-' + lang + '-' + id);
  if (!el) return;
  const open = el.classList.toggle('open');
  tog.classList.toggle('open', open);
}

function buildTafsirBlock(sId, ayatN, lang, file) {
  if (!file) return '';
  const cache = tafsirCache[file];
  const key = sId + ':' + ayatN;
  const langClass = lang; // 'ar' or 'id'
  const icon = lang === 'ar' ? '📖' : '📝';
  const baseLabel = lang === 'ar' ? 'Tafsir Arab' : 'Tafsir Indonesia';
  const selEl = document.getElementById('sel-tafsir-' + lang);
  const selectedText = selEl && selEl.selectedIndex > 0 ? selEl.options[selEl.selectedIndex].text : '';
  const label = selectedText ? baseLabel + ' (' + selectedText + ')' : baseLabel;
  const id = sId + '-' + ayatN;

  let bodyHtml = '';
  let rangeInfo = '';
  if (!cache || cache === 'loading') {
    bodyHtml = `<div class="tafsir-text ${langClass} open" style="font-size:12px;color:var(--c-muted)">Memuat tafsir…</div>`;
  } else if (cache === 'error') {
    bodyHtml = `<div class="tafsir-text ${langClass} open" style="font-size:12px;color:var(--c-muted)">Gagal memuat tafsir.</div>`;
  } else {
    // Resolve pointer (some entries are string refs to another key)
    let entry = cache[key];
    if (typeof entry === 'string') entry = cache[entry];
    if (!entry || !entry.text) return '';
    // Strip HTML tags — some tafsir files (e.g. As-Sa'di) contain raw HTML markup
    const tmp = document.createElement('div');
    tmp.innerHTML = entry.text;
    const plainText = (tmp.textContent || tmp.innerText || '').replace(/\s+/g,' ').trim();
    if (!plainText) return '';

    // If entry covers multiple ayat (e.g. As-Sa'di), try to split per ayat
    let displayText = plainText;
    if (entry.ayah_keys && entry.ayah_keys.length > 1) {
      const split = splitAssaadi(plainText, entry.ayah_keys, lang);
      const thisKey = sId + ':' + ayatN;
      if (split[thisKey]) {
        displayText = split[thisKey];
      } else {
        // fallback: show range info if can't split
        const first = entry.ayah_keys[0].split(':')[1];
        const last  = entry.ayah_keys[entry.ayah_keys.length - 1].split(':')[1];
        rangeInfo = ` <span style="font-size:10px;opacity:.7">(ayat ${first}–${last})</span>`;
      }
    }

    if (lang === 'ar') {
      // Split text into words, wrap each in a span for word-level TTS highlight
      const words = displayText.split(/\s+/).filter(Boolean);
      const wordSpansHtml = words.map(w =>
        `<span class="tafsir-ar-word" data-w="${w.replace(/"/g,'&quot;')}">${w}</span>`
      ).join(' ');
      bodyHtml = `<div class="tafsir-text ar" id="tafsir-text-ar-${id}"
        ><span class="tafsir-ar-span" data-ar="${displayText.replace(/"/g,'&quot;')}" onclick="speakAr(this.dataset.ar,this)">${wordSpansHtml}</span></div>`;
    } else {
      // Clean teks ID sebelum dibuat span (sama dengan proses di speakId)
      const idClean = displayText.replace(/^\s*\[\d+\]\.?\s*/,'').replace(/\[\d+\]/g,'').replace(/[()]/g,'').replace(/["\u201C\u201D\u2018\u2019]/g,'').replace(/`/g,"'").trim();
      const idWords = idClean.split(/\s+/).filter(Boolean).map(w =>
        `<span class="tts-id-word" data-w="${w.replace(/"/g,'&quot;')}">${w}</span>`
      ).join(' ');
      bodyHtml = `<div class="tafsir-text id" id="tafsir-text-id-${id}"
        onclick="speakId('',this)"
        >${idWords}</div>`;
    }
  }

  return `<div class="tafsir-block">
    <div class="tafsir-toggle ${langClass}" id="tafsir-tog-${langClass}-${id}"
      onclick="toggleTafsirItem('${id}','${langClass}')">
      <span>${icon} ${label}${rangeInfo||''}</span>
      <span class="tafsir-toggle-icon">▼</span>
    </div>
    ${bodyHtml}
  </div>`;
}

function renderBaca(){
  const sId=+document.getElementById('sel-surah').value;
  const s=DATA[sId];
  const fr=+document.getElementById('ayat-from').value;
  const to=+document.getElementById('ayat-to').value;
  const ayats=s.ayat.filter(a=>a.n>=fr&&a.n<=to);
  let html=`<div class="surah-header">
    <div class="surah-name-ar" style="font-family:"Conv_original-hafs"">${s.name}</div>
    <div class="surah-name-id">${sId}. ${s.name} — ${s.id} · ${s.jml} Ayat</div>
  </div>`;
  if(fr===1&&sId!==1&&sId!==9) html+=`<div class="bismillah">بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ</div>`;
  const adaKonten=showAyat||showKata||showTrAyat||showTrKata;
  if(!adaKonten){
    html+=`<p style="color:var(--c-muted);font-size:13px;text-align:center;padding:20px 0">Pilih tampilan di pengaturan.</p>`;
  } else {
    ayats.forEach(a=>{
      html+=`<div class="ayat-block">`;
      if(showAyat){
        html+=`<div class="ayat-ar">${a.ar}<span class="ayat-num">${toArabicNum(a.n)}</span></div>`;
      }
      if(showTrAyat&&!showAyat&&!showKata){
        // terjemahan saja tanpa tampilan arab

      }
      if(showTrAyat){
        // Clean terjemahan dulu (sama dengan yang akan di-speak) sebelum dibuat span
        const trClean = a.tr.replace(/^\s*\[\d+\]\.?\s*/,'').replace(/\[\d+\]/g,'').replace(/[()]/g,'').replace(/["\u201C\u201D\u2018\u2019]/g,'').replace(/`/g,"'").trim();
        const trWords = trClean.split(/\s+/).filter(Boolean).map(w=>
          `<span class="tts-id-word" data-w="${w.replace(/"/g,'&quot;')}">${w}</span>`
        ).join(' ');
        html+=`<div class="ayat-tr"><span style="font-weight:600;color:var(--c-text)">${a.n}.</span> <span class="ayat-tr-text" onclick="speakId('',this)">${trWords}</span></div>`;
      }
      if(showKata){
        const kataAyat = (typeof KATA_DATA !== 'undefined' && KATA_DATA[sId] && KATA_DATA[sId][a.n]) ? KATA_DATA[sId][a.n] : null;
        if(kataAyat && kataAyat.length){
          html+=`<div class="kata-grid">`;
          kataAyat.forEach(k=>{
            html+=`<div class="kata-item" data-ar="${k.ar.replace(/"/g,'&quot;')}" onclick="speakAr(this.dataset.ar,this)"><div class="kata-ar">${k.ar}</div>${showTrKata&&k.tr?`<div class="kata-tr">${k.tr}</div>`:''}</div>`;
          });
          html+=`<div class="kata-item kata-item-num"><div class="kata-ar" style="color:var(--c-gold)">${toArabicNum(a.n)}</div></div>`;
          html+=`</div>`;
        }
      }
      if(showFn && a.fn){
        const fnId=`${sId}-${a.n}`;
        html+=`<div class="fn-block">
          <div class="fn-toggle" id="fn-tog-${fnId}" onclick="toggleFnItem('${fnId}')">
            <span>📝 Catatan kaki</span>
            <span class="fn-toggle-icon">▼</span>
          </div>
          <div class="fn-text" id="fn-text-${fnId}">${
            a.fn.split(/\n(?=\[\d+\])/).map((part,i)=>{
              // Clean bagian catatan kaki sama dengan proses speakId
              const partClean = part.replace(/^\s*\[\d+\]\.?\s*/,'').replace(/\[\d+\]/g,'').replace(/[()]/g,'').replace(/["\u201C\u201D\u2018\u2019]/g,'').replace(/`/g,"'").trim();
              const partWords = partClean.split(/\s+/).filter(Boolean).map(w=>
                `<span class="tts-id-word" data-w="${w.replace(/"/g,'&quot;')}">${w}</span>`
              ).join(' ');
              return `<div class="fn-part" onclick="speakId('',this)">${partWords}</div>`;
            }).join('')
          }</div>
        </div>`;
      }
      html += buildTafsirBlock(sId, a.n, 'ar', tafsirArFile);
      html += buildTafsirBlock(sId, a.n, 'id', tafsirIdFile);
      html+=`</div>`;
    });
  }
  document.getElementById('baca-output').innerHTML=html;
}

// LATIHAN
let latState={};
function startLatihan(){
  const scope=document.getElementById('lat-scope').value;
  const mode=document.getElementById('lat-mode').value;
  const level=document.getElementById('lat-level').value;
  let ayats=[];

  function pushAyat(sId, ayatList){
    const s=DATA[sId];
    if(!s) return;
    if(level==='kata' && typeof KATA_DATA!=='undefined' && KATA_DATA[sId]){
      ayatList.forEach(a=>{
        const words=KATA_DATA[sId][a.n];
        if(words && words.length) words.forEach(w=>{if(w.tr) ayats.push({ar:w.ar,tr:w.tr,ayat:a.n,surah:s.name});});
      });
    } else {
      ayatList.forEach(a=>ayats.push({ar:a.ar,tr:a.tr,ayat:a.n,surah:s.name}));
    }
  }

  if(scope==='random-all'){
    for(let sId=1;sId<=114;sId++){
      const s=DATA[sId];
      if(s) pushAyat(sId, s.ayat);
    }
    ayats.sort(()=>Math.random()-.5);
  } else {
    const sId=+document.getElementById('lat-surah').value;
    const s=DATA[sId];
    const fr=+document.getElementById('lat-from').value;
    const to=+document.getElementById('lat-to').value;
    const filtered=s.ayat.filter(a=>a.n>=fr&&a.n<=to);
    pushAyat(sId, filtered);
    if(latOrder==='acak') ayats.sort(()=>Math.random()-.5);
  }

  if(!ayats.length){ayats=[{ar:'—',tr:'Tidak ada data',ayat:1,surah:'?'}];}
  const jumlahEl=document.getElementById('lat-jumlah');
  if(!jumlahEl.value||+jumlahEl.value>ayats.length) jumlahEl.value=ayats.length;
  ayats=ayats.slice(0,Math.max(1,+jumlahEl.value));
  latState={kata:ayats,mode,idx:0,score:0,total:ayats.length,answered:false};
  renderLatihan();
}

function renderLatihan(){
  const {kata,mode,idx,score,total}=latState;
  if(idx>=total){
    document.getElementById('latihan-output').innerHTML=`
      <div class="settings-card" style="text-align:center;padding:24px">
        <div style="font-size:32px;margin-bottom:8px">🎉</div>
        <div style="font-size:18px;font-weight:500;color:var(--c-green);margin-bottom:4px">${score} / ${total}</div>
        <div style="font-size:13px;color:var(--c-muted)">Latihan selesai!</div>
        <button class="apply-btn" onclick="startLatihan()" style="margin-top:16px">Ulangi</button>
      </div>`;
    return;
  }
  const k=kata[idx];
  const progress=Math.round((idx/total)*100);
  let Q,A;
  if(mode==='ar2tr'){Q=k.ar;A=k.tr;}
  else{Q=k.tr;A=k.ar;}

  // generate choices
  const pool=latState.kata.filter((_,i)=>i!==idx);
  const shuffled=[...pool].sort(()=>Math.random()-.5).slice(0,Math.min(3,pool.length));
  const choices=shuffled.map(c=>mode==='ar2tr'?c.tr:c.ar);
  choices.push(A);
  choices.sort(()=>Math.random()-.5);

  let html=`
    <div style="margin-bottom:14px">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
        <span style="font-size:13px;color:var(--c-muted);font-weight:500">${idx+1} / ${total}</span>
        <span style="font-size:13px;color:var(--c-green);font-weight:600">Skor: ${score}</span>
      </div>
      <div class="lat-progress-bar">
        <div class="lat-progress-fill" style="width:${progress}%"></div>
      </div>
    </div>
    <div class="lat-question-card">
      <div style="font-size:12px;color:var(--c-muted);margin-bottom:12px">Ayat ${k.ayat} · ${k.surah}</div>
      <div style="${mode==='ar2tr'?"font-family:'Conv_original-hafs';font-size:34px;direction:rtl;":"font-family:var(--font-sans,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif);font-size:18px;font-weight:500;direction:ltr;"}color:var(--c-text);line-height:1.6">${Q}</div>
    </div>
    <div class="lat-choices" id="choices">`;
  choices.forEach((c,i)=>{
    const isAr=mode==='tr2ar';
    const choiceStyle=isAr
      ? "font-family:'Conv_original-hafs';font-size:32px;direction:rtl;"
      : "font-size:16px;direction:ltr;";
    html+=`<button onclick="checkAnswer(${i},'${encodeURIComponent(c)}','${encodeURIComponent(A)}')" 
      class="lat-choice-btn" style="${choiceStyle}" id="choice-${i}">
      ${c}</button>`;
  });
  html+=`</div>`;
  document.getElementById('latihan-output').innerHTML=html;
}

function checkAnswer(i,chosen,correct){
  const c=decodeURIComponent(chosen),r=decodeURIComponent(correct);
  const btns=document.querySelectorAll('[id^=choice-]');
  btns.forEach((b,j)=>{
    if(b.textContent.trim()===r) b.style.background='var(--c-background-success,#E1F5EE)',b.style.borderColor='var(--c-green)';
  });
  if(c===r){
    latState.score++;
    btns[i].style.background='var(--c-green)';
    btns[i].style.color='#fff';
  } else {
    btns[i].style.background='var(--color-background-danger,#FCEBEB)';
    btns[i].style.borderColor='red';
  }
  btns.forEach(b=>b.disabled=true);
  setTimeout(()=>{latState.idx++;renderLatihan();},900);
}

// FLASHCARD
let fc={cards:[],idx:0,flipped:false,done:[]};
let fcOrder='urut';
function toggleFCOrder(v){
  fcOrder=v;
  document.getElementById('tgl-fc-urut').className='tgl'+(v==='urut'?' on':'');
  document.getElementById('tgl-fc-acak').className='tgl'+(v==='acak'?' on':'');
}
let touchStartX=0,touchStartY=0;

function toggleFcScope(){
  const scope=document.getElementById('fc-scope').value;
  const isAll=(scope==='all');
  document.getElementById('fc-surah-row').style.display=isAll?'none':'';
  document.getElementById('fc-ayat-row').style.display=(isAll||document.getElementById('fc-level').value!=='kata')?'none':'';
  updateFcJumlah();
}

function fcUpdateRange(){
  const v=document.getElementById('fc-surah').value;
  const s=DATA[+v];
  if(s) buildAyatOptions('fc-from','fc-to',s.jml,1,s.jml);
  toggleFcLevel();
}

function toggleFcLevel(){
  const level=document.getElementById('fc-level').value;
  const scope=document.getElementById('fc-scope').value;
  const ayatRow=document.getElementById('fc-ayat-row');
  ayatRow.style.display=(level==='kata' && scope!=='all')?'':'none';
  if(level==='kata' && scope!=='all'){
    const s=DATA[+document.getElementById('fc-surah').value];
    if(s) buildAyatOptions('fc-from','fc-to',s.jml,1,s.jml);
  }
  updateFcJumlah();
}

function updateFcJumlah(){
  const scope=document.getElementById('fc-scope').value;
  const sId=document.getElementById('fc-surah').value;
  const level=document.getElementById('fc-level').value;
  const isAll=(scope==='all');
  const fr=level==='kata'&&!isAll?+document.getElementById('fc-from').value||1:null;
  const to=level==='kata'&&!isAll?+document.getElementById('fc-to').value||null:null;
  let count=0;
  const srcs=isAll?Object.keys(DATA).map(Number):[+sId];
  srcs.forEach(id=>{
    const s=DATA[id];
    if(!s) return;
    if(level==='kata' && typeof KATA_DATA!=='undefined' && KATA_DATA[id]){
      s.ayat.forEach(a=>{
        if(fr!==null && (a.n<fr||a.n>to)) return;
        const words=KATA_DATA[id][a.n];
        if(words) count+=words.filter(w=>w.tr).length;
      });
    } else {
      count+=s.ayat.length;
    }
  });
  document.getElementById('fc-jumlah').value=count||'';
}

function startFlashcard(){
  const scope=document.getElementById('fc-scope').value;
  const sId=document.getElementById('fc-surah').value;
  const level=document.getElementById('fc-level').value;
  const isAll=(scope==='all');
  const fr=level==='kata'&&!isAll?+document.getElementById('fc-from').value:null;
  const to=level==='kata'&&!isAll?+document.getElementById('fc-to').value:null;
  let cards=[];
  const srcs=isAll?Object.keys(DATA).map(Number):[+sId];
  srcs.forEach(id=>{
    const s=DATA[id];
    if(!s) return;
    if(level==='kata' && typeof KATA_DATA!=='undefined' && KATA_DATA[id]){
      s.ayat.forEach(a=>{
        if(fr!==null && (a.n<fr||a.n>to)) return;
        const words=KATA_DATA[id][a.n];
        if(words && words.length){
          words.forEach(w=>{
            if(w.tr) cards.push({ar:w.ar,tr:w.tr,ref:`Q.S ${s.name} : ${a.n}`,surah:s.name});
          });
        }
      });
    } else {
      s.ayat.forEach(a=>cards.push({ar:a.ar,tr:a.tr,ref:`Q.S ${s.name} : ${a.n}`,surah:s.name}));
    }
  });
  if(fcOrder==='acak') cards.sort(()=>Math.random()-.5);
  const fcJumlahEl=document.getElementById('fc-jumlah');
  if(!fcJumlahEl.value||+fcJumlahEl.value>cards.length) fcJumlahEl.value=cards.length;
  cards=cards.slice(0,Math.max(1,+fcJumlahEl.value));
  fc={cards,idx:0,flipped:false,done:[]};
  renderFC();
}

function renderFC(){
  const {cards,idx,flipped,done}=fc;
  if(cards.length===0){document.getElementById('fc-output').innerHTML='<p style="color:var(--c-muted);font-size:13px;text-align:center">Mulai flashcard dari pengaturan di atas.</p>';return;}
  const c=cards[idx];
  let html=`<div class="fc-wrap">
    <div class="fc-mode-row">
      <button class="fc-mode-btn ${!fc.showTr?'on':''}" onclick="setFCMode(false)">Arab → Arti</button>
      <button class="fc-mode-btn ${fc.showTr?'on':''}" onclick="setFCMode(true)">Arti → Arab</button>
    </div>
    <div class="fc-nav">
      <button class="fc-btn" onclick="fcPrev()" aria-label="Sebelumnya">‹</button>
      <span>${idx+1} / ${cards.length}</span>
      <button class="fc-btn" onclick="fcNext()" aria-label="Berikutnya">›</button>
    </div>
    <div class="flashcard" id="fc-card" ontouchstart="fcTouch(event)" onclick="fcClick(event)">`;

  if(!flipped){
    const main=fc.showTr?c.tr:c.ar;
    const isAr=!fc.showTr;
    html+=`<div class="fc-front">
      <div class="${isAr?'fc-ar':'fc-tr-big'}" style="${isAr?'':'font-size:20px;color:var(--c-text)'}">${main}</div>
      <div class="fc-hint">Tap untuk lihat jawaban</div>
    </div>`;
  } else {
    // Arab → Arti: jawaban = terjemahan (hijau+besar), Arab kecil di atas
    // Arti → Arab: jawaban = arab (hijau+besar), terjemahan kecil di bawah
    if(!fc.showTr){
      html+=`<div class="fc-back">
        <div class="fc-ar-sm" style="font-size:18px;direction:rtl;font-family:'Conv_original-hafs';color:var(--c-muted);font-weight:400">
          ${c.ar}</div>
        <div class="fc-tr-big" style="font-size:22px;color:var(--c-green);font-weight:600">
          ${c.tr}</div>
        <div class="fc-surah">${c.ref}</div>
      </div>`;
    } else {
      html+=`<div class="fc-back">
        <div class="fc-tr-big" style="font-family:'Conv_original-hafs';font-size:42px;direction:rtl;color:var(--c-green);font-weight:400">
          ${c.ar}</div>
        <div class="fc-ar-sm" style="font-size:13px;direction:ltr;font-family:var(--font-sans);color:var(--c-muted);font-weight:400">
          ${c.tr}</div>
        <div class="fc-surah">${c.ref}</div>
      </div>`;
    }
  }
  html+=`</div>
    <div class="swipe-hint">← Geser atau ketuk untuk navigasi →</div>
  </div>`;
  document.getElementById('fc-output').innerHTML=html;
}

function setFCMode(v){fc.showTr=v;fc.flipped=false;renderFC();}
function flipFC(){fc.flipped=!fc.flipped;renderFC();}
function fcNext(){fc.idx=(fc.idx+1)%fc.cards.length;fc.flipped=false;renderFC();}
function fcPrev(){fc.idx=(fc.idx-1+fc.cards.length)%fc.cards.length;fc.flipped=false;renderFC();}
function fcMark(know){
  if(know&&!fc.done.includes(fc.idx)) fc.done.push(fc.idx);
  else fc.done=fc.done.filter(d=>d!==fc.idx);
  fc.idx=(fc.idx+1)%fc.cards.length;fc.flipped=false;
  renderFC();
}
let _fcTouchHandled=false;
function fcClick(e){
  // Only handle mouse clicks (not touch, which is handled by fcTouch)
  if(_fcTouchHandled){_fcTouchHandled=false;return;}
  flipFC();
}
function fcTouch(e){
  const startX=e.touches[0].clientX;
  const startY=e.touches[0].clientY;
  const card=e.currentTarget;
  card.ontouchend=function(ev){
    card.ontouchend=null;
    const dx=ev.changedTouches[0].clientX-startX;
    const dy=ev.changedTouches[0].clientY-startY;
    _fcTouchHandled=true;
    if(Math.abs(dx)>40&&Math.abs(dx)>Math.abs(dy)){
      // swipe navigasi
      if(dx<0)fcNext();else fcPrev();
    } else if(Math.abs(dx)<10&&Math.abs(dy)<10){
      // single tap — langsung balik
      flipFC();
    }
  };
  e.preventDefault();
}

function switchTab(t){
  if(activeTab===t){
    toggleActiveSettings();
    return;
  }
  activeTab=t;
  ['baca','latihan','flashcard'].forEach(x=>{
    document.getElementById('content-'+x).style.display=x===t?'block':'none';
    document.getElementById('tab-'+x).className='tab'+(x===t?' active':'');
  });
  ['baca','latihan','flashcard'].forEach(x=>{
    const chv=document.getElementById('chv-'+x);
    if(!chv) return;
    chv.style.display=x===t?'inline-block':'none';
    if(x===t){
      const isOpen=document.getElementById(getPrefix(x)+'-settings-body').classList.contains('open');
      chv.classList.toggle('open',isOpen);
    }
  });
}

let activeTab='baca';
function getPrefix(tab){return tab==='latihan'?'lat':tab==='flashcard'?'fc':'baca';}
function toggleActiveSettings(){
  const prefix=getPrefix(activeTab);
  const body=document.getElementById(prefix+'-settings-body');
  const chv=document.getElementById('chv-'+activeTab);
  const isOpen=body.classList.contains('open');
  body.classList.toggle('open',!isOpen);
  if(chv) chv.classList.toggle('open',!isOpen);
}
function closeSettings(prefix){
  const tab=prefix==='lat'?'latihan':prefix==='fc'?'flashcard':'baca';
  document.getElementById(prefix+'-settings-body').classList.remove('open');
  const chv=document.getElementById('chv-'+tab);
  if(chv) chv.classList.remove('open');
}
function updateSummary(prefix){}

// init
function populateSurahSelect(selId, includeAll) {
  const sel = document.getElementById(selId);
  sel.innerHTML = '';
  for (let i = 1; i <= 114; i++) {
    const s = DATA[i];
    if (!s) continue;
    const opt = document.createElement('option');
    opt.value = i;
    opt.textContent = i + ' - ' + s.name;
    sel.appendChild(opt);
  }
  if (includeAll) {
    const opt = document.createElement('option');
    opt.value = 'all';
    opt.textContent = 'Semua surat (1-114)';
    sel.appendChild(opt);
  }
  // Default to surah 1
  sel.value = '1';
}

populateSurahSelect('sel-surah', false);
